global:
  imageRegistry: ""
  imagePullSecrets: []

platform:
  gateway:
    url: &gatewayUrl http://gateway-gateway.platform.svc.cluster.local:8080
    address: &gatewayAddress gateway-gateway.platform.svc.cluster.local:8080
  serviceTokens:
    reminders:
      existingSecret: &remindersServiceTokenSecret reminders-service-token
      existingSecretKey: &remindersServiceTokenKey token
    telegramConnector:
      existingSecret: &telegramConnectorServiceTokenSecret telegram-connector-service-token
      existingSecretKey: &telegramConnectorServiceTokenKey token
    k8sRunner:
      existingSecret: &k8sRunnerServiceTokenSecret k8s-runner-service-token
      existingSecretKey: &k8sRunnerServiceTokenKey token
  database:
    mode: external
    existingSecret: &databaseUrlSecret agyn-app-database-urls
    existingSecretKeyPattern: "{{ app }}"

apps:
  reminders:
    enabled: true
  telegramConnector:
    enabled: false
    appId: &telegramConnectorAppId ""

runners:
  k8s:
    enabled: true

reminders:
  env:
    - name: HTTP_ADDRESS
      value: ":8080"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *databaseUrlSecret
          key: reminders
    - name: ZITI_IDENTITY_FILE
      value: /ziti/identity.json
    - name: ZITI_SERVICE_NAME
      value: app-reminders
    - name: GATEWAY_SERVICE_NAME
      value: gateway
    - name: GATEWAY_URL
      value: *gatewayUrl
    - name: SERVICE_TOKEN
      valueFrom:
        secretKeyRef:
          name: *remindersServiceTokenSecret
          key: *remindersServiceTokenKey

telegram-connector:
  env:
    - name: HTTP_ADDRESS
      value: ":8080"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *databaseUrlSecret
          key: telegram-connector
    - name: ZITI_IDENTITY_FILE
      value: /ziti/identity.json
    - name: SERVICE_TOKEN
      valueFrom:
        secretKeyRef:
          name: *telegramConnectorServiceTokenSecret
          key: *telegramConnectorServiceTokenKey
    - name: GATEWAY_URL
      value: *gatewayUrl
    - name: ZITI_SERVICE_NAME
      value: app-telegram
    - name: GATEWAY_SERVICE_NAME
      value: gateway
    - name: APP_ID
      value: *telegramConnectorAppId
    - name: TELEGRAM_BASE_URL
      value: https://api.telegram.org
    - name: TELEGRAM_POLL_TIMEOUT
      value: "25s"

k8s-runner:
  env:
    - name: GRPC_ADDR
      value: 0.0.0.0:50051
    - name: KUBE_NAMESPACE
      value: agyn-workloads
    - name: PVC_STORAGE_SIZE
      value: 10Gi
    - name: ZITI_ENABLED
      value: "true"
    - name: GATEWAY_ADDRESS
      value: *gatewayAddress
    - name: CAPABILITY_IMPLEMENTATIONS
      value: '{"docker":"rootless"}'
    - name: SERVICE_TOKEN
      valueFrom:
        secretKeyRef:
          name: *k8sRunnerServiceTokenSecret
          key: *k8sRunnerServiceTokenKey
    - name: ZITI_ENROLLMENT_TIMEOUT
      value: 2m
    - name: LOG_LEVEL
      value: info
  rbac:
    clusterWide: true
  securityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
