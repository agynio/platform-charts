global:
  imageRegistry: ""
  imagePullSecrets: []

validation:
  requireExistingSecrets: false

platform:
  database:
    mode: external
    existingSecret: agyn-platform-database-urls
    existingSecretKeyPattern: "{{ .service }}"
  databaseUrlEnvName: DATABASE_URL
  serviceEndpoints:
    egress: egress:50051
    authorization: authorization:50051
    identity: identity:50051
    notifications: notifications:50051
    runners: runners:50051
    zitiManagement: ziti-management:50051
  # OIDC defaults empty so the gateway boots in OIDC-disabled mode.
  # Set both fields together when wiring a real issuer.
  oidc:
    issuerUrl: ""
    clientId: ""

postgres:
  enabled: false
  host: ""
  port: 5432
  sslMode: require
  databaseNames:
    egress: egress
    agents: agents
    agentsOrchestrator: orchestrator
    apps: apps
    chat: chat
    expose: expose
    files: files
    identity: identity
    llm: llm
    organizations: organizations
    runners: runners
    secrets: secrets
    threads: threads
    tracing: tracing
    users: users
    zitiManagement: ziti_management
  existingSecret: ""
  usernameKeyPattern: "{{ service }}-username"
  passwordKeyPattern: "{{ service }}-password"

s3:
  existingSecret: agyn-files-s3
  accessKeyKey: access-key
  secretKeyKey: secret-key
  endpoint: s3.example.com
  bucket: agyn-files
  region: us-east-1
  useSSL: true
  forcePathStyle: false

notifications-redis:
  fullnameOverride: notifications-redis

openfga:
  apiUrl: http://openfga.openfga.svc.cluster.local:8080
  storeId: ""
  modelId: ""

registryMirror:
  enabled: false
  fullnameOverride: registry-mirror
  persistence:
    enabled: true
    size: 20Gi
  proxy:
    enabled: true
    remoteurl: https://registry-1.docker.io

ncps:
  fullnameOverride: ncps
  enabled: false

egress:
  enabled: true
  fullnameOverride: egress
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: agyn-platform-database-urls
          key: egress
    - name: ZITI_MANAGEMENT_ADDRESS
      value: "ziti-management:50051"
    - name: AUTHORIZATION_SERVICE_ADDRESS
      value: "authorization:50051"
    - name: SECRETS_SERVICE_ADDRESS
      value: "secrets:50051"
    - name: NOTIFICATIONS_ADDRESS
      value: "notifications:50051"
    - name: RECONCILIATION_INTERVAL
      value: "60s"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

egress-gateway:
  enabled: true
  fullnameOverride: egress-gateway
  extraVolumeMounts:
    - name: ziti-identity
      mountPath: /var/lib/ziti
      readOnly: true
    - name: egress-ca
      mountPath: /var/run/agyn/egress-ca
      readOnly: true
  extraVolumes:
    - name: ziti-identity
      secret:
        secretName: egress-gateway-ziti-identity
    - name: egress-ca
      secret:
        secretName: egress-ca
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

gateway:
  gateway:
    egressRulesGrpcTarget: egress:50051

secrets:
  egressRules:
    grpcTarget: egress:50051
