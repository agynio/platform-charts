contractConfigMaps:
  enabled: true

global:
  imageRegistry: ""
  imagePullSecrets: []

validation:
  requireExistingSecrets: false

platform:
  database:
    mode: external
    existingSecret: &platformDatabaseSecret agyn-platform-database-urls
    # egress.env DATABASE_URL secretKeyRef.name derives from this anchor.
    existingSecretKeyPattern: "{{ .service }}"
    # Creates any database in postgres.databases that does not exist yet,
    # before anything that needs one starts. The bundled instance creates them
    # only when its volume is first initialised, so without this a service
    # added to a running install has none.
    provisioning:
      enabled: true
      # Defaults to postgres.databases. Set to provision a different set.
      databases: {}
      # Credentials allowed to create a database. Only needed when the
      # platform's own user may not; otherwise a service URL from
      # platform.database.existingSecret names the same server.
      adminSecret:
        name: ""
        key: url
      # Connected to while checking, so it must exist already.
      maintenanceDatabase: postgres
      waitTimeoutSeconds: 300
      backoffLimit: 6
      image:
        repository: postgres
        tag: 16.6-alpine
        pullPolicy: IfNotPresent
  databaseUrlEnvName: DATABASE_URL
  serviceEndpoints:
    egress: &platformEndpointEgress "egress:50051"
    llm: &platformEndpointLlm "llm:50051"
    # Downstream egress, egress-gateway, Gateway, and Secrets targets derive
    # from these endpoint anchors; render-time checks prevent override drift.
    authorization: &platformEndpointAuthorization "authorization:50051"
    groups: &platformEndpointGroups "groups:50051"
    networks: &platformEndpointNetworks "networks:50051"
    identity: &platformEndpointIdentity "identity:50051"
    notifications: &platformEndpointNotifications "notifications:50051"
    secrets: &platformEndpointSecrets "secrets:50051"
    metering: &platformEndpointMetering "metering:50051"
    tracing: &platformEndpointTracing "tracing:50051"
    terminalProxy: &platformEndpointTerminalProxy "terminal-proxy:50051"
    agents: &platformEndpointAgents "agents:50051"
    runners: &platformEndpointRunners "runners:50051"
    zitiManagement: &platformEndpointZitiManagement "ziti-management:50051"
    # The ordinary API. Everything that calls the platform as a client -- the
    # provisioning controller, the runner, the bundled apps -- derives its
    # target from these rather than naming one of its own.
    gateway: &platformGatewayAddress "gateway:8080"
    gatewayUrl: &platformGatewayURL "http://gateway:8080"
    nats: &platformEndpointNats "nats://nats:4222"
  externalUrls:
    # The Terminal Proxy hands this to every client when it issues a ticket, so
    # a wrong value is a browser-side DNS failure with nothing pointing back
    # here. It defaulted to the reserved example.com placeholder, which is
    # syntactically valid and therefore caught by nothing — the terminal-proxy
    # chart's own guard only fires on an empty value. The platform's own domain
    # is at least right for the install that forgets to set it.
    terminalProxyWebSocket: &platformTerminalProxyWebSocketURL "wss://terminal.agyn.dev/terminal"
  runnersAuthorizationPolicy:
    enabled: true
    orchestratorServiceAccount:
      name: agents-orchestrator
      namespace: ""
    identityServiceAccounts:
      - name: gateway
        namespace: ""
      - name: expose
        namespace: ""
      - name: notifications
        namespace: ""
      - name: chat
        namespace: ""
    internalServiceAccounts:
      - name: terminal-proxy
        namespace: ""
  eventBus:
    url: *platformEndpointNats
    urlEnvName: NATS_URL
  # Namespace agent and sandbox workloads are scheduled into. It is separate
  # from the platform namespace so workload pods never share a namespace with
  # the services that control them.
  workloads:
    namespace: agyn-workloads
    createNamespace: true
  egressCa:
    create: true
    secretName: egress-ca
    commonName: Agyn Egress CA
    duration: 87600h
    issuerRef:
      name: selfsigned
      kind: ClusterIssuer
  secretsEncryptionKey:
    create: true
    secretName: secrets-encryption-key
    key: encryptionKey
  # The platform admin identity's bootstrap token. Generated per install and
  # held in a Secret rather than rendered into the Gateway's Deployment, so it
  # is not readable by anyone who can read a workload and survives an upgrade
  # re-rendering the release.
  #
  # create=false is the operator-owned mode a GitOps install uses: reuse reads
  # the existing Secret, which a renderer without cluster access cannot do, so
  # it would otherwise mint a new token and rotate the old one out from under
  # the Gateway. Point secretName at a Secret you manage and create it yourself.
  bootstrapToken:
    create: true
    secretName: &platformBootstrapTokenSecret gateway-bootstrap-token
    key: &platformBootstrapTokenSecretKey token
    # The identity the token resolves to. Not a secret, and deliberately a
    # constant: changing it strands every resource the previous one provisioned.
    identityId: &platformAdminIdentityId a3c1e9d2-7f4b-5e1a-9c3d-2b8f6a4e7d10
  # Istio routing for the platform's public hostnames.
  ingress:
    enabled: false
    baseDomain: ""
    gateway:
      create: true
      name: platform-gateway
      namespace: istio-gateway
      tlsSecret: wildcard-agyn-dev-tls
      selector:
        istio: ingressgateway
      # Hosts served by other gateways on the same listener (Argo CD, minio).
      extraHosts: []
    # subdomain "" means the bare base domain. apiToGateway sends /api and
    # /socket.io to the platform gateway so a UI and its API share a hostname.
    routes:
      - name: gateway
        subdomain: gateway
        service: gateway
        port: 8080
      - name: console-app
        subdomain: console
        service: console-app
        port: 8080
        apiToGateway: true
      - name: chat-app
        subdomain: chat
        service: chat-app
        port: 8080
        apiToGateway: true
      - name: tracing-app
        subdomain: tracing
        service: tracing-app
        port: 8080
        apiToGateway: true
      # 3000 is the port the app's Service actually publishes.
      - name: sandboxes-app
        subdomain: sandboxes
        service: sandboxes-app
        port: 3000
        apiToGateway: true
      - name: llm-proxy
        subdomain: llm
        service: llm-proxy
        port: 8080
      - name: media-proxy
        subdomain: media
        service: media-proxy
        port: 8080
      # The image proxy, serving the registry API that workload image references
      # point at. agents-orchestrator rewrites every catalog reference to this
      # hostname (image-proxy's IMAGE_PROXY_HOST), and the node's container
      # runtime pulls from it, so without this route every image a user
      # registers after install fails to pull.
      - name: registry
        subdomain: registry
        service: image-proxy
        port: 5000
  # Connection details every service reads. The openfga.* block below deploys
  # an instance that satisfies these; point them elsewhere to use a managed one.
  #
  # Namespace-relative on purpose: the bundled instance lands in whatever
  # namespace the release does, so naming one here would break the moment an
  # operator installs somewhere else.
  openfga:
    apiUrl: http://openfga:8080
    storeId: ""
    modelId: ""
  # OIDC defaults empty so the gateway boots in OIDC-disabled mode.
  # Set both fields together when wiring a real issuer.
  oidc:
    issuerUrl: ""
    clientId: ""
    audience: ""

# In-cluster Postgres, disabled by default. Enabling it makes the umbrella
# self-contained: the chart creates one database per service and renders the
# DATABASE_URL secret the services already expect
# (platform.database.existingSecret), so no database has to be provisioned
# beforehand. A production install leaves this off and points
# platform.database at a managed instance instead.
#
# Single instance, single credential, no backups — this is a development and
# evaluation convenience, not a production database.
postgres:
  enabled: false
  fullnameOverride: platform-postgres
  # Consumed by the postgres-helm subchart.
  postgres:
    database: agyn
    username: agyn
    password: agyn
    pgdata: /var/lib/postgresql/data/pgdata
  persistence:
    enabled: true
    size: 10Gi
    mountPath: /var/lib/postgresql/data
    volumeClaimTemplateName: data
  probes:
    readiness:
      execCommand: ["pg_isready", "-U", "agyn"]
    liveness:
      execCommand: ["pg_isready", "-U", "agyn"]
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Runs the generated CREATE DATABASE script on first initialisation.
  extraVolumeMounts:
    - name: init
      mountPath: /docker-entrypoint-initdb.d
      readOnly: true
  extraVolumes:
    - name: init
      configMap:
        name: platform-postgres-init
  # sslmode for the generated URLs. In-cluster traffic to a bundled instance
  # is not TLS-terminated, so this defaults to disable.
  sslMode: disable
  # Secret key (the name each service looks itself up by) mapped to the
  # database created for it. The key must match
  # platform.database.existingSecretKeyPattern rendered for that service.
  databases:
    agents: agents
    agents-orchestrator: orchestrator
    apps: apps
    chat: chat
    egress: egress
    expose: expose
    files: files
    groups: groups
    identity: identity
    image-proxy: image_proxy
    images: images
    keycloak: keycloak
    openfga: openfga
    llm: llm
    metering: metering
    networks: networks
    organizations: organizations
    runners: runners
    secrets: secrets
    threads: threads
    tracing: tracing
    users: users
    ziti-management: ziti_management

s3:
  existingSecret: agyn-files-s3
  # Rendered from the minio credentials below when the bundled instance is on.
  createSecret: true
  accessKeyKey: access-key
  secretKeyKey: secret-key
  # Defaults target the bundled minio; override for managed object storage.
  endpoint: minio:9000
  bucket: agyn-files
  region: us-east-1
  useSSL: false
  forcePathStyle: true

notifications-redis:
  fullnameOverride: notifications-redis
  # The chart reserves 100m/128Mi per node; a notification bus this size idles
  # under 10Mi, and there are four nodes.
  master:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  replica:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

nats:
  # On by default: the platform's own services assume an event bus. networks
  # exits without one, and apps, users and agents-orchestrator lose group sync
  # silently rather than failing. Point them at an external NATS by disabling
  # this and overriding the endpoint.
  enabled: false
  fullnameOverride: nats
  # The upstream chart sets no requests at all, which leaves the event bus
  # BestEffort and first in line for eviction. It idles around 25Mi.
  container:
    merge:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi
        maxSize: 10Gi
      memoryStore:
        enabled: false
  service:
    enabled: true
    ports:
      nats:
        enabled: true
      monitor:
        enabled: false
  natsBox:
    enabled: false
  platform:
    streams:
      enabled: true
      image:
        repository: natsio/nats-box
        tag: 0.18.0
        pullPolicy: IfNotPresent
      backoffLimit: 6
      restartPolicy: OnFailure
      replicas: 1
      retention: limits
      storage: file
      discard: old
      # Stream config JSON uses the NATS API schema: durations are
      # nanoseconds and sizes are bytes.
      maxAge: 604800000000000
      maxBytes: 1073741824
      duplicateWindow: 120000000000
      waitTimeout: 120s
      definitions:
        - name: AGYN_GROUPS
          subjects:
            - agyn.groups.>
        - name: AGYN_NETWORKS
          subjects:
            - agyn.networks.>

# Authorization store. platform.openfga carries the connection details every
# service reads; the openfga/openfga-db blocks below deploy an instance to
# satisfy them. Point platform.openfga elsewhere and disable both to use a
# managed OpenFGA.
openfga:
  enabled: false
  fullnameOverride: openfga
  replicaCount: 1
  datastore:
    engine: postgres
    # The instance this release already runs. The uri names a host that was
    # never a dependency of this chart, so openfga.enabled could not work.
    uri: postgresql://agyn:agyn@platform-postgres:5432/openfga?sslmode=disable
    applyMigrations: true
    waitForMigrations: true
    migrationType: initContainer
  postgresql:
    enabled: false
  grpc:
    addr: 0.0.0.0:8081
  http:
    enabled: true
    addr: 0.0.0.0:8080
  playground:
    enabled: true
    port: 3000
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi


# Object storage backing the files service. s3.* is the connection contract;
# this block deploys the instance that satisfies it.
minio:
  enabled: false
  fullnameOverride: minio
  mode: standalone
  replicas: 1
  rootUser: minioadmin
  rootPassword: minioadmin
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
  buckets: []
  users: []
  policies: []
  customCommands: []
  svcaccts: []

metering:
  enabled: true
  fullnameOverride: metering
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: metering
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

registryMirror:
  enabled: false
  fullnameOverride: registry-mirror
  persistence:
    enabled: true
    size: 20Gi
  proxy:
    enabled: true
    remoteurl: https://registry-1.docker.io

ncps:
  fullnameOverride: ncps
  enabled: false

egress:
  enabled: true
  fullnameOverride: egress
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: egress
          # The default key is the rendered value of
          # platform.database.existingSecretKeyPattern for service "egress".
    - name: ZITI_MANAGEMENT_ADDRESS
      value: *platformEndpointZitiManagement
    - name: AUTHORIZATION_SERVICE_ADDRESS
      value: *platformEndpointAuthorization
    - name: SECRETS_SERVICE_ADDRESS
      value: *platformEndpointSecrets
    - name: NOTIFICATIONS_ADDRESS
      value: *platformEndpointNotifications
    - name: RECONCILIATION_INTERVAL
      value: "60s"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

egress-gateway:
  enabled: true
  fullnameOverride: egress-gateway
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: EGRESS_ADDRESS
      value: *platformEndpointEgress
    - name: SECRETS_SERVICE_ADDRESS
      value: *platformEndpointSecrets
    - name: NOTIFICATIONS_ADDRESS
      value: *platformEndpointNotifications
    - name: METERING_ADDRESS
      value: *platformEndpointMetering
    - name: TRACING_ADDRESS
      value: *platformEndpointTracing
    - name: AGENTS_SERVICE_ADDRESS
      value: *platformEndpointAgents
    - name: ZITI_MANAGEMENT_ADDRESS
      value: *platformEndpointZitiManagement
    - name: ZITI_IDENTITY_FILE
      value: "/var/lib/ziti/identity.json"
    - name: EGRESS_CA_CERT_PATH
      value: "/var/run/agyn/egress-ca/tls.crt"
    - name: EGRESS_CA_KEY_PATH
      value: "/var/run/agyn/egress-ca/tls.key"
  extraVolumeMounts:
    - name: ziti-identity
      mountPath: /var/lib/ziti
      readOnly: false
    - name: egress-ca
      mountPath: /var/run/agyn/egress-ca
      readOnly: true
  extraVolumes:
    # Writable: the gateway self-enrols at startup and writes its identity
    # here. A pre-enrolled secret mount made that write fail on a read-only
    # filesystem, and the data plane never came up.
    - name: ziti-identity
      emptyDir: {}
    - name: egress-ca
      secret:
        secretName: egress-ca
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 1000m
      memory: 512Mi

groups:
  # On by default. The Gateway routes GroupsGateway to it unconditionally and
  # several services dial groups:50051, so an install without it answers those
  # calls with 503. It was gated only because it needs the event bus, which
  # now ships enabled too.
  enabled: true
  fullnameOverride: groups
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: groups
          # The default key is the rendered platform database secret key
          # pattern for service "groups".
    - name: AUTHORIZATION_GRPC_TARGET
      value: *platformEndpointAuthorization
    - name: IDENTITY_GRPC_TARGET
      value: *platformEndpointIdentity
    - name: NATS_URL
      value: *platformEndpointNats
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

secrets:
  egressRules:
    grpcTarget: *platformEndpointEgress
  # Deleting a secret a Subscription references is refused, so Secrets must be
  # able to ask. Unset, deletes fail closed rather than orphaning a credential.
  llm:
    grpcTarget: *platformEndpointLlm
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi


users:
  env:
    # Setting env here replaces the subchart's default list, which includes
    # DATABASE_URL — so it must be re-declared or the pod comes up without a
    # database URL and crashloops.
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: users
    - name: ZITI_MANAGEMENT_ADDRESS
      value: *platformEndpointZitiManagement
    - name: GROUPS_ADDRESS
      value: *platformEndpointGroups
    - name: NATS_URL
      value: *platformEndpointNats
    - name: GROUP_SYNC_DURABLE
      value: "users-group-sync"
    # Restricts the one-shot first-admin claim to this verified address, so the
    # user the bundled Keycloak ships with becomes cluster admin on first
    # sign-in. Empty lets whoever signs in first take it.
    #
    # Must be kept equal to keycloak.adminUser.email. It cannot be derived from
    # it: this chart pins users 0.5.3, whose service-base (0.1.4) renders env
    # with toYaml and no tpl, so a value here is taken literally.
    - name: FIRST_ADMIN_EMAIL
      value: "admin@agyn.dev"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

apps:
  env:
    # Setting env here replaces the subchart's default list, which includes
    # DATABASE_URL — so it must be re-declared or the pod comes up without a
    # database URL and crashloops.
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: apps
    - name: GROUPS_GRPC_TARGET
      value: *platformEndpointGroups
    - name: NATS_URL
      value: *platformEndpointNats
    - name: GROUP_SYNC_DURABLE
      value: "apps-group-sync"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

agents-orchestrator:
  env:
    - name: GROUP_SYNC_ENABLED
      value: "true"
    - name: GROUPS_ADDRESS
      value: *platformEndpointGroups
    - name: NATS_URL
      value: *platformEndpointNats
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

networks:
  # On by default, like the other services the Gateway routes to. It needs more
  # than the event bus: an OpenZiti overlay whose service policies let runners
  # bind, and a ziti-management new enough to serve ListServicesByTag. Without
  # those it reports "service not found in ziti network" or exits on its first
  # reconciliation — disable it on installs that have no overlay.
  enabled: true
  fullnameOverride: networks
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: networks
    - name: DEPENDENCY_CLIENTS_ENABLED
      value: "true"
    - name: AUTHORIZATION_GRPC_TARGET
      value: *platformEndpointAuthorization
    - name: ZITI_MANAGEMENT_GRPC_TARGET
      value: *platformEndpointZitiManagement
    - name: IDENTITY_GRPC_TARGET
      value: *platformEndpointIdentity
    - name: GROUPS_GRPC_TARGET
      value: *platformEndpointGroups
    - name: NOTIFICATIONS_GRPC_TARGET
      value: *platformEndpointNotifications
    - name: NATS_URL
      value: *platformEndpointNats
    - name: TUNNEL_LIVENESS_INTERVAL
      value: "30s"
    - name: RECONCILIATION_INTERVAL
      value: "60s"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

gateway:
  # Raw passthrough: the gateway subchart has no native key for this target.
  env:
    - name: TERMINAL_PROXY_GRPC_TARGET
      value: *platformEndpointTerminalProxy
  gateway:
    egressRulesGrpcTarget: *platformEndpointEgress
    groupsGrpcTarget: *platformEndpointGroups
    networksGrpcTarget: *platformEndpointNetworks
    terminalProxyGrpcTarget: *platformEndpointTerminalProxy
    # Derived from platform.bootstrapToken, never set here: the token reaches
    # the Gateway by reference so it stays out of the Deployment spec.
    clusterAdminIdentityId: *platformAdminIdentityId
    clusterAdminTokenSecret:
      name: *platformBootstrapTokenSecret
      key: *platformBootstrapTokenSecretKey
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

terminal-proxy:
  enabled: true
  fullnameOverride: terminal-proxy
  podSecurityContext:
    enabled: true
    fsGroup: 10001
  initContainers: []
  # Configured through the subchart's own interface rather than a raw env list,
  # so its required-value checks (websocketUrl, ticket signing key) actually run.
  terminalProxy:
    websocketUrl: *platformTerminalProxyWebSocketURL
    runnersAddress: *platformEndpointRunners
    agentsAddress: *platformEndpointAgents
    authorizationAddress: *platformEndpointAuthorization
    ticketSigningKey:
      secretName: terminal-proxy-ticket-signing
      secretKey: signing-key
    # Reaching a runner in another network is only possible over the overlay,
    # so this stays on. The identity is requested at startup and lease-renewed
    # per pod, per openziti.md#service-identity-self-enrollment — there is no
    # identity file or Secret to mount.
    ziti:
      enabled: true
      managementAddress: *platformEndpointZitiManagement
  service:
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 8080
        targetPort: http
        protocol: TCP
      - name: grpc
        port: 50051
        targetPort: grpc
        protocol: TCP
  containerPorts:
    - name: http
      containerPort: 8080
      protocol: TCP
    - name: grpc
      containerPort: 50051
      protocol: TCP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

authorization:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
chat:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
identity:
  # Identity owns the platform admin identity: it registers the record and
  # grants it admin on cluster:global at its own startup. Without this the
  # provisioning controller authenticates and then fails every call, because
  # nothing has made it a cluster admin.
  #
  # extraEnvVars rather than env: this adds a variable the chart does not set,
  # so it appends cleanly instead of overriding an entry Helm would later
  # reorder.
  extraEnvVars:
    - name: PLATFORM_IDENTITY_ID
      value: *platformAdminIdentityId
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Bundled OIDC provider. On by default so an install authenticates without an
# external issuer being supplied; an install with its own IdP turns it off and
# points platform.oidc at that instead.
#
# externalUrl is the token issuer. It has to be a URL that resolves both in the
# browser and inside the cluster, because the Gateway fetches discovery from it
# server-side and zitadel/oidc rejects a document whose issuer differs from the
# URL it came from.
keycloak:
  enabled: false
  database:
    host: platform-postgres
    name: keycloak
    username: agyn
    password: agyn

notifications:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
organizations:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
images:
  resources:
