contractConfigMaps:
  enabled: true

global:
  imageRegistry: ""
  imagePullSecrets: []

validation:
  requireExistingSecrets: false

platform:
  database:
    mode: external
    existingSecret: &platformDatabaseSecret agyn-platform-database-urls
    # egress.env DATABASE_URL secretKeyRef.name derives from this anchor.
    existingSecretKeyPattern: "{{ .service }}"
  databaseUrlEnvName: DATABASE_URL
  serviceEndpoints:
    egress: &platformEndpointEgress "egress:50051"
    # Downstream egress, egress-gateway, Gateway, and Secrets targets derive
    # from these endpoint anchors; render-time checks prevent override drift.
    authorization: &platformEndpointAuthorization "authorization:50051"
    groups: &platformEndpointGroups "groups:50051"
    networks: &platformEndpointNetworks "networks:50051"
    identity: &platformEndpointIdentity "identity:50051"
    notifications: &platformEndpointNotifications "notifications:50051"
    secrets: &platformEndpointSecrets "secrets:50051"
    metering: &platformEndpointMetering "metering:50051"
    tracing: &platformEndpointTracing "tracing:50051"
    terminalProxy: &platformEndpointTerminalProxy "terminal-proxy:50051"
    agents: &platformEndpointAgents "agents:50051"
    runners: &platformEndpointRunners "runners:50051"
    zitiManagement: &platformEndpointZitiManagement "ziti-management:50051"
    nats: &platformEndpointNats "nats://nats:4222"
  externalUrls:
    terminalProxyWebSocket: &platformTerminalProxyWebSocketURL "wss://terminal.example.com/terminal"
  runnersAuthorizationPolicy:
    enabled: true
    orchestratorServiceAccount:
      name: agents-orchestrator
      namespace: ""
    identityServiceAccounts:
      - name: gateway
        namespace: ""
      - name: expose
        namespace: ""
      - name: notifications
        namespace: ""
      - name: chat
        namespace: ""
    internalServiceAccounts:
      - name: terminal-proxy
        namespace: ""
  eventBus:
    url: *platformEndpointNats
    urlEnvName: NATS_URL
  # Namespace agent and sandbox workloads are scheduled into. It is separate
  # from the platform namespace so workload pods never share a namespace with
  # the services that control them.
  workloads:
    namespace: agyn-workloads
    createNamespace: true
  egressCa:
    create: true
    secretName: egress-ca
    commonName: Agyn Egress CA
    duration: 87600h
    issuerRef:
      name: selfsigned
      kind: ClusterIssuer
  secretsEncryptionKey:
    create: true
    secretName: secrets-encryption-key
    key: encryptionKey
  # Istio routing for the platform's public hostnames.
  ingress:
    enabled: false
    baseDomain: ""
    gateway:
      create: true
      name: platform-gateway
      namespace: istio-gateway
      tlsSecret: wildcard-agyn-dev-tls
      selector:
        istio: ingressgateway
      # Hosts served by other gateways on the same listener (Argo CD, minio).
      extraHosts: []
    # subdomain "" means the bare base domain. apiToGateway sends /api and
    # /socket.io to the platform gateway so a UI and its API share a hostname.
    routes:
      - name: gateway
        subdomain: gateway
        service: gateway
        port: 8080
      - name: console-app
        subdomain: console
        service: console-app
        port: 8080
        apiToGateway: true
      - name: chat-app
        subdomain: chat
        service: chat-app
        port: 8080
        apiToGateway: true
      - name: tracing-app
        subdomain: tracing
        service: tracing-app
        port: 8080
        apiToGateway: true
      - name: llm-proxy
        subdomain: llm
        service: llm-proxy
        port: 8080
      - name: media-proxy
        subdomain: media
        service: media-proxy
        port: 8080
  # Connection details every service reads. The openfga.* block below deploys
  # an instance that satisfies these; point them elsewhere to use a managed one.
  openfga:
    apiUrl: http://openfga.platform.svc.cluster.local:8080
    storeId: ""
    modelId: ""
  # OIDC defaults empty so the gateway boots in OIDC-disabled mode.
  # Set both fields together when wiring a real issuer.
  oidc:
    issuerUrl: ""
    clientId: ""
    audience: ""

# In-cluster Postgres, disabled by default. Enabling it makes the umbrella
# self-contained: the chart creates one database per service and renders the
# DATABASE_URL secret the services already expect
# (platform.database.existingSecret), so no database has to be provisioned
# beforehand. A production install leaves this off and points
# platform.database at a managed instance instead.
#
# Single instance, single credential, no backups — this is a development and
# evaluation convenience, not a production database.
postgres:
  enabled: false
  fullnameOverride: platform-postgres
  # Consumed by the postgres-helm subchart.
  postgres:
    database: agyn
    username: agyn
    password: agyn
    pgdata: /var/lib/postgresql/data/pgdata
  persistence:
    enabled: true
    size: 10Gi
    mountPath: /var/lib/postgresql/data
    volumeClaimTemplateName: data
  probes:
    readiness:
      execCommand: ["pg_isready", "-U", "agyn"]
    liveness:
      execCommand: ["pg_isready", "-U", "agyn"]
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Runs the generated CREATE DATABASE script on first initialisation.
  extraVolumeMounts:
    - name: init
      mountPath: /docker-entrypoint-initdb.d
      readOnly: true
  extraVolumes:
    - name: init
      configMap:
        name: platform-postgres-init
  # sslmode for the generated URLs. In-cluster traffic to a bundled instance
  # is not TLS-terminated, so this defaults to disable.
  sslMode: disable
  # Secret key (the name each service looks itself up by) mapped to the
  # database created for it. The key must match
  # platform.database.existingSecretKeyPattern rendered for that service.
  databases:
    agents: agents
    agents-orchestrator: orchestrator
    apps: apps
    chat: chat
    egress: egress
    expose: expose
    files: files
    groups: groups
    identity: identity
    llm: llm
    metering: metering
    networks: networks
    organizations: organizations
    runners: runners
    secrets: secrets
    threads: threads
    tracing: tracing
    users: users
    ziti-management: ziti_management

s3:
  existingSecret: agyn-files-s3
  # Rendered from the minio credentials below when the bundled instance is on.
  createSecret: true
  accessKeyKey: access-key
  secretKeyKey: secret-key
  # Defaults target the bundled minio; override for managed object storage.
  endpoint: minio:9000
  bucket: agyn-files
  region: us-east-1
  useSSL: false
  forcePathStyle: true

notifications-redis:
  fullnameOverride: notifications-redis
  # The chart reserves 100m/128Mi per node; a notification bus this size idles
  # under 10Mi, and there are four nodes.
  master:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  replica:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

nats:
  enabled: false
  fullnameOverride: nats
  # The upstream chart sets no requests at all, which leaves the event bus
  # BestEffort and first in line for eviction. It idles around 25Mi.
  container:
    merge:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi
        maxSize: 10Gi
      memoryStore:
        enabled: false
  service:
    enabled: true
    ports:
      nats:
        enabled: true
      monitor:
        enabled: false
  natsBox:
    enabled: false
  platform:
    streams:
      enabled: true
      image:
        repository: natsio/nats-box
        tag: 0.18.0
        pullPolicy: IfNotPresent
      backoffLimit: 6
      restartPolicy: OnFailure
      replicas: 1
      retention: limits
      storage: file
      discard: old
      # Stream config JSON uses the NATS API schema: durations are
      # nanoseconds and sizes are bytes.
      maxAge: 604800000000000
      maxBytes: 1073741824
      duplicateWindow: 120000000000
      waitTimeout: 120s
      definitions:
        - name: AGYN_GROUPS
          subjects:
            - agyn.groups.>
        - name: AGYN_NETWORKS
          subjects:
            - agyn.networks.>

# Authorization store. platform.openfga carries the connection details every
# service reads; the openfga/openfga-db blocks below deploy an instance to
# satisfy them. Point platform.openfga elsewhere and disable both to use a
# managed OpenFGA.
openfga:
  enabled: true
  fullnameOverride: openfga
  replicaCount: 1
  datastore:
    engine: postgres
    uri: postgresql://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
    applyMigrations: true
    waitForMigrations: true
    migrationType: initContainer
  postgresql:
    enabled: false
  grpc:
    addr: 0.0.0.0:8081
  http:
    enabled: true
    addr: 0.0.0.0:8080
  playground:
    enabled: true
    port: 3000
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

openfga-db:
  enabled: true
  fullnameOverride: openfga-db
  postgres:
    database: openfga
    username: openfga
    password: openfga
    pgdata: /var/lib/postgresql/data/pgdata
  persistence:
    enabled: true
    size: 5Gi
    mountPath: /var/lib/postgresql/data
    volumeClaimTemplateName: data
  probes:
    readiness:
      execCommand: ["pg_isready", "-U", "openfga", "-d", "openfga"]
    liveness:
      execCommand: ["pg_isready", "-U", "openfga", "-d", "openfga"]
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Object storage backing the files service. s3.* is the connection contract;
# this block deploys the instance that satisfies it.
minio:
  enabled: true
  fullnameOverride: minio
  mode: standalone
  replicas: 1
  rootUser: minioadmin
  rootPassword: minioadmin
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
  buckets: []
  users: []
  policies: []
  customCommands: []
  svcaccts: []

metering:
  enabled: true
  fullnameOverride: metering
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

registryMirror:
  enabled: false
  fullnameOverride: registry-mirror
  persistence:
    enabled: true
    size: 20Gi
  proxy:
    enabled: true
    remoteurl: https://registry-1.docker.io

ncps:
  fullnameOverride: ncps
  enabled: false

egress:
  enabled: true
  fullnameOverride: egress
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: egress
          # The default key is the rendered value of
          # platform.database.existingSecretKeyPattern for service "egress".
    - name: ZITI_MANAGEMENT_ADDRESS
      value: *platformEndpointZitiManagement
    - name: AUTHORIZATION_SERVICE_ADDRESS
      value: *platformEndpointAuthorization
    - name: SECRETS_SERVICE_ADDRESS
      value: *platformEndpointSecrets
    - name: NOTIFICATIONS_ADDRESS
      value: *platformEndpointNotifications
    - name: RECONCILIATION_INTERVAL
      value: "60s"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

egress-gateway:
  enabled: true
  fullnameOverride: egress-gateway
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: EGRESS_ADDRESS
      value: *platformEndpointEgress
    - name: SECRETS_SERVICE_ADDRESS
      value: *platformEndpointSecrets
    - name: NOTIFICATIONS_ADDRESS
      value: *platformEndpointNotifications
    - name: METERING_ADDRESS
      value: *platformEndpointMetering
    - name: TRACING_ADDRESS
      value: *platformEndpointTracing
    - name: AGENTS_SERVICE_ADDRESS
      value: *platformEndpointAgents
    - name: ZITI_MANAGEMENT_ADDRESS
      value: *platformEndpointZitiManagement
    - name: ZITI_IDENTITY_FILE
      value: "/var/lib/ziti/identity.json"
    - name: EGRESS_CA_CERT_PATH
      value: "/var/run/agyn/egress-ca/tls.crt"
    - name: EGRESS_CA_KEY_PATH
      value: "/var/run/agyn/egress-ca/tls.key"
  extraVolumeMounts:
    - name: ziti-identity
      mountPath: /var/lib/ziti
      readOnly: true
    - name: egress-ca
      mountPath: /var/run/agyn/egress-ca
      readOnly: true
  extraVolumes:
    - name: ziti-identity
      secret:
        secretName: egress-gateway-ziti-identity
    - name: egress-ca
      secret:
        secretName: egress-ca
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 1000m
      memory: 512Mi

groups:
  enabled: false
  fullnameOverride: groups
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: groups
          # The default key is the rendered platform database secret key
          # pattern for service "groups".
    - name: AUTHORIZATION_GRPC_TARGET
      value: *platformEndpointAuthorization
    - name: IDENTITY_GRPC_TARGET
      value: *platformEndpointIdentity
    - name: NATS_URL
      value: *platformEndpointNats
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

secrets:
  egressRules:
    grpcTarget: *platformEndpointEgress
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi


users:
  env:
    # Setting env here replaces the subchart's default list, which includes
    # DATABASE_URL — so it must be re-declared or the pod comes up without a
    # database URL and crashloops.
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: users
    - name: ZITI_MANAGEMENT_ADDRESS
      value: *platformEndpointZitiManagement
    - name: GROUPS_ADDRESS
      value: *platformEndpointGroups
    - name: NATS_URL
      value: *platformEndpointNats
    - name: GROUP_SYNC_DURABLE
      value: "users-group-sync"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

apps:
  env:
    # Setting env here replaces the subchart's default list, which includes
    # DATABASE_URL — so it must be re-declared or the pod comes up without a
    # database URL and crashloops.
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: apps
    - name: GROUPS_GRPC_TARGET
      value: *platformEndpointGroups
    - name: NATS_URL
      value: *platformEndpointNats
    - name: GROUP_SYNC_DURABLE
      value: "apps-group-sync"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

agents-orchestrator:
  env:
    - name: GROUP_SYNC_ENABLED
      value: "true"
    - name: GROUPS_ADDRESS
      value: *platformEndpointGroups
    - name: NATS_URL
      value: *platformEndpointNats
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

networks:
  enabled: false
  fullnameOverride: networks
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: networks
    - name: DEPENDENCY_CLIENTS_ENABLED
      value: "true"
    - name: AUTHORIZATION_GRPC_TARGET
      value: *platformEndpointAuthorization
    - name: ZITI_MANAGEMENT_GRPC_TARGET
      value: *platformEndpointZitiManagement
    - name: IDENTITY_GRPC_TARGET
      value: *platformEndpointIdentity
    - name: GROUPS_GRPC_TARGET
      value: *platformEndpointGroups
    - name: NOTIFICATIONS_GRPC_TARGET
      value: *platformEndpointNotifications
    - name: NATS_URL
      value: *platformEndpointNats
    - name: TUNNEL_LIVENESS_INTERVAL
      value: "30s"
    - name: RECONCILIATION_INTERVAL
      value: "60s"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

gateway:
  # Raw passthrough: the gateway subchart has no native key for this target.
  env:
    - name: TERMINAL_PROXY_GRPC_TARGET
      value: *platformEndpointTerminalProxy
  gateway:
    egressRulesGrpcTarget: *platformEndpointEgress
    groupsGrpcTarget: *platformEndpointGroups
    networksGrpcTarget: *platformEndpointNetworks
    terminalProxyGrpcTarget: *platformEndpointTerminalProxy
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

terminal-proxy:
  enabled: true
  fullnameOverride: terminal-proxy
  podSecurityContext:
    enabled: true
    fsGroup: 10001
  initContainers: []
  # Configured through the subchart's own interface rather than a raw env list,
  # so its required-value checks (websocketUrl, ticket signing key) actually run.
  terminalProxy:
    websocketUrl: *platformTerminalProxyWebSocketURL
    runnersAddress: *platformEndpointRunners
    agentsAddress: *platformEndpointAgents
    authorizationAddress: *platformEndpointAuthorization
    ticketSigningKey:
      secretName: terminal-proxy-ticket-signing
      secretKey: signing-key
    # Reaching a runner in another network is only possible over the overlay,
    # so this stays on. The identity is requested at startup and lease-renewed
    # per pod, per openziti.md#service-identity-self-enrollment — there is no
    # identity file or Secret to mount.
    ziti:
      enabled: true
      managementAddress: *platformEndpointZitiManagement
  service:
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 8080
        targetPort: http
        protocol: TCP
      - name: grpc
        port: 50051
        targetPort: grpc
        protocol: TCP
  containerPorts:
    - name: http
      containerPort: 8080
      protocol: TCP
    - name: grpc
      containerPort: 50051
      protocol: TCP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

