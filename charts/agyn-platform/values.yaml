# ---------------------------------------------------------------------------
# Provisioning: what this release declares the platform should contain.
#
# Rendered into the objects the provisioning controller reconciles, so what a
# release provisions is a property of these values rather than of the binary
# that applies them. This is the one tier an operator must fill in: a release
# that declares no cluster administrator installs a platform nobody can
# administer.
# ---------------------------------------------------------------------------
# The controller that reconciles the declarations below, and the custom
# resource definitions they are written against.
platform-controller:
  enabled: true
  gateway:
    url: *platformGatewayURL
  zitiManagement:
    target: http://ziti-management:50051
  bootstrapToken:
    secretName: *platformBootstrapTokenSecret
    key: *platformBootstrapTokenSecretKey

# What this release declares the platform should contain.
provisioning:
  # The organization platform-provisioned resources live in. Its slug is
  # cluster-wide unique and user-visible -- it appears in image references and
  # app addresses -- so it is a deliberate choice rather than an
  # implementation detail.
  systemOrganization:
    slug: agyn-platform
    name: Agyn Platform

  # Who administers this cluster, by the address their identity provider
  # asserts. Nobody is granted the role for signing in first, so an install
  # that names none has none. Each entry is granted once that account exists,
  # and removing one revokes the role.
  # The user the bundled Keycloak ships with, so the bundle has an administrator
  # by declaration rather than by whoever races to sign in first. Keep equal to
  # keycloak.adminUser.email.
  clusterAdmins:
    - address: admin@agyn.dev

  # Registered public, which is what makes them usable from every organization
  # on the platform. An environment names a workspace image and an agent
  # runtime image, so a fresh platform ships one of each kind that is usable
  # without registering anything by hand.
  images:
    - name: devcontainer
      description: Default workspace image.
      type: workspace
      repository: ghcr.io/agynio/devcontainer
      visibility: public
    - name: codex
      description: Codex agent runtime.
      type: agent_runtime
      repository: ghcr.io/agynio/agyn-runtime-codex
      visibility: public
    - name: claude
      description: Claude Code agent runtime.
      type: agent_runtime
      repository: ghcr.io/agynio/agyn-runtime-claude
      visibility: public
    - name: agn
      description: agn agent runtime.
      type: agent_runtime
      repository: ghcr.io/agynio/agyn-runtime-agn
      visibility: public

  # The platform's baseline overlay connectivity. OpenZiti denies by default,
  # so a missing policy makes a service invisible rather than refused. Written
  # against role attributes rather than named services, so a rule covers every
  # runner and app registered later.
  overlayPolicies:
    enabled: true
    # The services the platform binds and dials. Declared with the policies
    # because a policy naming one cannot be applied until it exists, and both
    # are overlay configuration rather than platform resources.
    services:
      - name: gateway
        roleAttributes: [gateway]
        intercept:
          addresses: [gateway.ziti]
          portRanges: [{low: 443, high: 443}]
      - name: llm-proxy
        roleAttributes: [llm-proxy]
        intercept:
          addresses: [llm-proxy.ziti]
          portRanges: [{low: 80, high: 80}]
      - name: tracing
        roleAttributes: [tracing]
        intercept:
          addresses: [tracing.ziti]
          portRanges: [{low: 443, high: 443}]
      # One per vendor, static: the vendor set is closed, so nothing is
      # provisioned per organization, environment or attachment. What varies per
      # workload is only which of these it may dial, carried by the
      # llm-native-<vendor> attribute the Orchestrator stamps on its identity.
      - name: llm-intercept-anthropic
        roleAttributes: [llm-intercept-services]
        intercept:
          addresses: [api.anthropic.com]
          portRanges: [{low: 443, high: 443}]
      - name: llm-intercept-openai
        roleAttributes: [llm-intercept-services]
        intercept:
          addresses: [chatgpt.com]
          portRanges: [{low: 443, high: 443}]
    policies:
      - name: agents-dial-gateway
        type: Dial
        identityRoles: ["#agents"]
        serviceRoles: ["@gateway"]
      - name: orchestrators-dial-runners
        type: Dial
        identityRoles: ["#orchestrators"]
        serviceRoles: ["#runner-services"]
      # Reaching a runner in another network is only possible over the overlay,
      # so both of these dial runner services directly.
      - name: terminal-proxy-dial-runners
        type: Dial
        identityRoles: ["#terminal-proxy-hosts"]
        serviceRoles: ["#runner-services"]
      - name: runners-service-dial-runners
        type: Dial
        identityRoles: ["#runners-service-hosts"]
        serviceRoles: ["#runner-services"]
      - name: gateway-bind
        type: Bind
        identityRoles: ["#gateway-hosts"]
        serviceRoles: ["@gateway"]
      - name: runners-bind
        type: Bind
        identityRoles: ["#runners"]
        serviceRoles: ["#runner-services"]
      - name: agents-dial-llm-proxy
        type: Dial
        identityRoles: ["#agents"]
        serviceRoles: ["@llm-proxy"]
      - name: llm-proxy-bind
        type: Bind
        identityRoles: ["#llm-proxy-hosts"]
        serviceRoles: ["@llm-proxy"]
      - name: agents-dial-tracing
        type: Dial
        identityRoles: ["#agents"]
        serviceRoles: ["@tracing"]
      - name: tracing-bind
        type: Bind
        identityRoles: ["#tracing-hosts"]
        serviceRoles: ["@tracing"]
      - name: apps-dial-gateway
        type: Dial
        identityRoles: ["#apps"]
        serviceRoles: ["@gateway"]
      - name: apps-bind
        type: Bind
        identityRoles: ["#apps"]
        serviceRoles: ["#app-services"]
      - name: gateway-dial-apps
        type: Dial
        identityRoles: ["#gateway-hosts"]
        serviceRoles: ["#app-services"]
      - name: egress-gateway-bind
        type: Bind
        identityRoles: ["#egress-gateway-hosts"]
        serviceRoles: ["#egress-services"]
      - name: llm-proxy-bind-intercept
        type: Bind
        identityRoles: ["#llm-proxy-hosts"]
        serviceRoles: ["#llm-intercept-services"]
      - name: native-anthropic-dial
        type: Dial
        identityRoles: ["#llm-native-anthropic"]
        serviceRoles: ["@llm-intercept-anthropic"]
      - name: native-openai-dial
        type: Dial
        identityRoles: ["#llm-native-openai"]
        serviceRoles: ["@llm-intercept-openai"]

# ---------------------------------------------------------------------------
# The workload layer: the runner that executes agent workloads and the apps
# bundled with this release.
#
# One flag per component decides both halves — whether the workload is deployed
# and whether the release declares it — because they are the same decision. Each
# mounts a service token the provisioning controller writes into the Secret
# named here; on a first install the workload may start before that Secret
# exists and retry until it does.
#
# Overrides go in extraEnvVars, which the service charts append to their own
# env rather than replacing it, so nothing here re-declares an entry it does not
# mean to change.
# ---------------------------------------------------------------------------
bundledRunner:
  enabled: true
  name: k8s-runner
  labels:
    type: kubernetes
  capabilities:
    - docker
  tokenSecretName: &bundledRunnerTokenSecret k8s-runner-service-token

bundledApps:
  reminders:
    enabled: true
    # Not cosmetic: this names the app's OpenZiti service, which is the name the
    # app binds on.
    slug: reminders
    displayName: Reminders
    # Public for the same reason the bundled images are: it belongs to the system
    # organization, and the catalog only offers public apps to the others.
    visibility: public
    tokenSecretName: &remindersTokenSecret reminders-service-token
  telegramConnector:
    enabled: false
    slug: telegram
    displayName: Telegram Connector
    visibility: internal
    tokenSecretName: &telegramTokenSecret telegram-connector-service-token

# Each of these sets `env` in full rather than appending to the subchart's list.
# That is not the interface we want -- an operator should not re-declare entries
# they never meant to change -- but it is the only correct one these charts
# offer today: `extraEnvVars` is concatenated after `env`, and a later duplicate
# only wins until the first upgrade. Helm patches `env` by name, and the merge
# reorders the pair so the chart default silently takes over. Deriving these
# needs the service charts to expose the three values as their own keys.
k8s-runner:
  # This list replaces the chart's rather than merging with it, so every entry
  # the runner needs has to be repeated here -- CATALOG_PATH went missing that
  # way and the runner reported no flavors.
  env:
    - name: GRPC_ADDR
      value: 0.0.0.0:50051
    - name: CATALOG_PATH
      value: /etc/agyn/runner-catalog/catalog.yaml
    - name: KUBE_NAMESPACE
      value: agyn-workloads
    - name: PVC_STORAGE_SIZE
      value: 10Gi
    - name: ZITI_ENABLED
      value: "true"
    - name: GATEWAY_ADDRESS
      value: *platformGatewayAddress
    - name: CAPABILITY_IMPLEMENTATIONS
      value: '{"docker":"rootless"}'
    - name: SERVICE_TOKEN
      valueFrom:
        secretKeyRef:
          name: *bundledRunnerTokenSecret
          key: token
    - name: ZITI_ENROLLMENT_TIMEOUT
      value: 2m
    - name: LOG_LEVEL
      value: info
  rbac:
    clusterWide: true
  securityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

reminders:
  env:
    - name: HTTP_ADDRESS
      value: ":8080"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: reminders
    - name: ZITI_IDENTITY_FILE
      value: /ziti/identity.json
    - name: ZITI_SERVICE_NAME
      value: app-reminders
    - name: GATEWAY_SERVICE_NAME
      value: gateway
    - name: GATEWAY_URL
      value: *platformGatewayURL
    - name: SERVICE_TOKEN
      valueFrom:
        secretKeyRef:
          name: *remindersTokenSecret
          key: token

telegram-connector:
  env:
    - name: HTTP_ADDRESS
      value: ":8080"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: telegram-connector
    - name: ZITI_IDENTITY_FILE
      value: /ziti/identity.json
    - name: ZITI_SERVICE_NAME
      value: app-telegram
    - name: GATEWAY_SERVICE_NAME
      value: gateway
    - name: GATEWAY_URL
      value: *platformGatewayURL
    - name: SERVICE_TOKEN
      valueFrom:
        secretKeyRef:
          name: *telegramTokenSecret
          key: token
    # The app's own id, stored beside its token by the controller: CreateApp is
    # the only place it is ever returned, and the connector exits without one.
    - name: APP_ID
      valueFrom:
        secretKeyRef:
          name: *telegramTokenSecret
          key: app_id
    - name: TELEGRAM_BASE_URL
      value: https://api.telegram.org
    - name: TELEGRAM_POLL_TIMEOUT
      value: "25s"
