global:
  imageRegistry: ""
  imagePullSecrets: []

validation:
  requireExistingSecrets: false

platform:
  database:
    mode: external
    existingSecret: &platformDatabaseSecret agyn-platform-database-urls
    # egress.env DATABASE_URL secretKeyRef.name derives from this anchor.
    existingSecretKeyPattern: "{{ .service }}"
  databaseUrlEnvName: DATABASE_URL
  serviceEndpoints:
    egress: &platformEndpointEgress "egress:50051"
    # Downstream egress, egress-gateway, Gateway, and Secrets targets derive
    # from these endpoint anchors; render-time checks prevent override drift.
    authorization: &platformEndpointAuthorization "authorization:50051"
    groups: &platformEndpointGroups "groups:50051"
    networks: &platformEndpointNetworks "networks:50051"
    identity: &platformEndpointIdentity "identity:50051"
    notifications: &platformEndpointNotifications "notifications:50051"
    secrets: &platformEndpointSecrets "secrets:50051"
    metering: &platformEndpointMetering "metering:50051"
    tracing: &platformEndpointTracing "tracing:50051"
    agents: &platformEndpointAgents "agents:50051"
    runners: &platformEndpointRunners "runners:50051"
    zitiManagement: &platformEndpointZitiManagement "ziti-management:50051"
    nats: &platformEndpointNats "nats://nats:4222"
  eventBus:
    url: *platformEndpointNats
    urlEnvName: NATS_URL
  # OIDC defaults empty so the gateway boots in OIDC-disabled mode.
  # Set both fields together when wiring a real issuer.
  oidc:
    issuerUrl: ""
    clientId: ""
    audience: ""

postgres:
  enabled: false
  host: ""
  port: 5432
  sslMode: require
  databaseNames:
    egress: egress
    groups: groups
    networks: networks
    agents: agents
    agentsOrchestrator: orchestrator
    apps: apps
    chat: chat
    expose: expose
    files: files
    identity: identity
    llm: llm
    organizations: organizations
    runners: runners
    secrets: secrets
    threads: threads
    tracing: tracing
    users: users
    zitiManagement: ziti_management
  existingSecret: ""
  usernameKeyPattern: "{{ service }}-username"
  passwordKeyPattern: "{{ service }}-password"

s3:
  existingSecret: agyn-files-s3
  accessKeyKey: access-key
  secretKeyKey: secret-key
  endpoint: s3.example.com
  bucket: agyn-files
  region: us-east-1
  useSSL: true
  forcePathStyle: false

notifications-redis:
  fullnameOverride: notifications-redis
  # The chart reserves 100m/128Mi per node; a notification bus this size idles
  # under 10Mi, and there are four nodes.
  master:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  replica:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

nats:
  enabled: false
  fullnameOverride: nats
  # The upstream chart sets no requests at all, which leaves the event bus
  # BestEffort and first in line for eviction. It idles around 25Mi.
  container:
    merge:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi
        maxSize: 10Gi
      memoryStore:
        enabled: false
  service:
    enabled: true
    ports:
      nats:
        enabled: true
      monitor:
        enabled: false
  natsBox:
    enabled: false
  platform:
    streams:
      enabled: true
      image:
        repository: natsio/nats-box
        tag: 0.18.0
        pullPolicy: IfNotPresent
      backoffLimit: 6
      restartPolicy: OnFailure
      replicas: 1
      retention: limits
      storage: file
      discard: old
      # Stream config JSON uses the NATS API schema: durations are
      # nanoseconds and sizes are bytes.
      maxAge: 604800000000000
      maxBytes: 1073741824
      duplicateWindow: 120000000000
      waitTimeout: 120s
      definitions:
        - name: AGYN_GROUPS
          subjects:
            - agyn.groups.>
        - name: AGYN_NETWORKS
          subjects:
            - agyn.networks.>

openfga:
  apiUrl: http://openfga.openfga.svc.cluster.local:8080
  storeId: ""
  modelId: ""

registryMirror:
  enabled: false
  fullnameOverride: registry-mirror
  persistence:
    enabled: true
    size: 20Gi
  proxy:
    enabled: true
    remoteurl: https://registry-1.docker.io

ncps:
  fullnameOverride: ncps
  enabled: false

egress:
  enabled: true
  fullnameOverride: egress
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: egress
          # The default key is the rendered value of
          # platform.database.existingSecretKeyPattern for service "egress".
    - name: ZITI_MANAGEMENT_ADDRESS
      value: *platformEndpointZitiManagement
    - name: AUTHORIZATION_SERVICE_ADDRESS
      value: *platformEndpointAuthorization
    - name: SECRETS_SERVICE_ADDRESS
      value: *platformEndpointSecrets
    - name: NOTIFICATIONS_ADDRESS
      value: *platformEndpointNotifications
    - name: RECONCILIATION_INTERVAL
      value: "60s"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

egress-gateway:
  enabled: true
  fullnameOverride: egress-gateway
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: EGRESS_ADDRESS
      value: *platformEndpointEgress
    - name: SECRETS_SERVICE_ADDRESS
      value: *platformEndpointSecrets
    - name: NOTIFICATIONS_ADDRESS
      value: *platformEndpointNotifications
    - name: METERING_ADDRESS
      value: *platformEndpointMetering
    - name: TRACING_ADDRESS
      value: *platformEndpointTracing
    - name: AGENTS_SERVICE_ADDRESS
      value: *platformEndpointAgents
    - name: ZITI_MANAGEMENT_ADDRESS
      value: *platformEndpointZitiManagement
    - name: ZITI_IDENTITY_FILE
      value: "/var/lib/ziti/identity.json"
    - name: EGRESS_CA_CERT_PATH
      value: "/var/run/agyn/egress-ca/tls.crt"
    - name: EGRESS_CA_KEY_PATH
      value: "/var/run/agyn/egress-ca/tls.key"
  extraVolumeMounts:
    - name: ziti-identity
      mountPath: /var/lib/ziti
      readOnly: true
    - name: egress-ca
      mountPath: /var/run/agyn/egress-ca
      readOnly: true
  extraVolumes:
    - name: ziti-identity
      secret:
        secretName: egress-gateway-ziti-identity
    - name: egress-ca
      secret:
        secretName: egress-ca
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 1000m
      memory: 512Mi

groups:
  enabled: false
  fullnameOverride: groups
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: groups
          # The default key is the rendered platform database secret key
          # pattern for service "groups".
    - name: AUTHORIZATION_GRPC_TARGET
      value: *platformEndpointAuthorization
    - name: IDENTITY_GRPC_TARGET
      value: *platformEndpointIdentity
    - name: NATS_URL
      value: *platformEndpointNats
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

secrets:
  egressRules:
    grpcTarget: *platformEndpointEgress
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi


users:
  env:
    # Setting env here replaces the subchart's default list, which includes
    # DATABASE_URL — so it must be re-declared or the pod comes up without a
    # database URL and crashloops.
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: users
    - name: ZITI_MANAGEMENT_ADDRESS
      value: *platformEndpointZitiManagement
    - name: GROUPS_ADDRESS
      value: *platformEndpointGroups
    - name: NATS_URL
      value: *platformEndpointNats
    - name: GROUP_SYNC_DURABLE
      value: "users-group-sync"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

apps:
  env:
    # Setting env here replaces the subchart's default list, which includes
    # DATABASE_URL — so it must be re-declared or the pod comes up without a
    # database URL and crashloops.
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: apps
    - name: GROUPS_GRPC_TARGET
      value: *platformEndpointGroups
    - name: NATS_URL
      value: *platformEndpointNats
    - name: GROUP_SYNC_DURABLE
      value: "apps-group-sync"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

agents-orchestrator:
  env:
    - name: GROUP_SYNC_ENABLED
      value: "true"
    - name: GROUPS_ADDRESS
      value: *platformEndpointGroups
    - name: NATS_URL
      value: *platformEndpointNats
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

networks:
  enabled: false
  fullnameOverride: networks
  env:
    - name: GRPC_ADDRESS
      value: ":50051"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: *platformDatabaseSecret
          key: networks
    - name: DEPENDENCY_CLIENTS_ENABLED
      value: "true"
    - name: AUTHORIZATION_GRPC_TARGET
      value: *platformEndpointAuthorization
    - name: ZITI_MANAGEMENT_GRPC_TARGET
      value: *platformEndpointZitiManagement
    - name: IDENTITY_GRPC_TARGET
      value: *platformEndpointIdentity
    - name: GROUPS_GRPC_TARGET
      value: *platformEndpointGroups
    - name: NOTIFICATIONS_GRPC_TARGET
      value: *platformEndpointNotifications
    - name: NATS_URL
      value: *platformEndpointNats
    - name: TUNNEL_LIVENESS_INTERVAL
      value: "30s"
    - name: RECONCILIATION_INTERVAL
      value: "60s"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

gateway:
  gateway:
    egressRulesGrpcTarget: *platformEndpointEgress
    groupsGrpcTarget: *platformEndpointGroups
    networksGrpcTarget: *platformEndpointNetworks
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

terminal-proxy:
  enabled: false
  fullnameOverride: terminal-proxy
  terminalProxy:
    runnersAddress: *platformEndpointRunners
    agentsAddress: *platformEndpointAgents
    authorizationAddress: *platformEndpointAuthorization
    # Public WebSocket endpoint handed to clients when a ticket is issued.
    # Must match the ingress host that routes to this service.
    websocketUrl: ""
    ziti:
      enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

