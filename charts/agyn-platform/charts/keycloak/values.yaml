nameOverride: ""
fullnameOverride: keycloak

commonAnnotations: {}

global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  registry: quay.io
  repository: keycloak/keycloak
  tag: "26.4"
  pullPolicy: IfNotPresent

replicaCount: 1
revisionHistoryLimit: 10
updateStrategy: {}
deploymentAnnotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  enabled: false
  fsGroup: null

rbac:
  create: false
  clusterWide: false
  rules: []

priorityClassName: ""
terminationGracePeriodSeconds: null

# Browser-facing origin, including the port when the ingress is not on 443.
# The token issuer is derived from it, and every OIDC consumer must be
# configured with exactly the same string — zitadel/oidc rejects a discovery
# document whose issuer differs from the URL it was fetched from.
#
# Defaults to the bundle VM's own address: agyn.dev is BASE_DOMAIN and 2496 is
# INGRESS_HOST_PORT, both defaulted the same way in install-platform.sh. An
# install on another domain or port overrides this and the four origins below.
externalUrl: https://auth.agyn.dev:2496

realm: agyn

# Everything needed to reach externalUrl, owned by this chart so an upgrade
# delivers it. A bundle VM bakes its manifests once and wipes them, so anything
# left outside the chart never reaches a machine that is already running.
#
# An install with real DNS and a publicly-trusted certificate wants none of it:
# the hostname resolves everywhere, the port is 443, and the issuer's cert is
# already trusted. Turn the pieces off individually there.
routing:
  # Istio Gateway + VirtualService for the auth hostname. Its own Gateway rather
  # than a host on the platform's: two Gateways may share a port and selector as
  # long as their hosts do not overlap, and a chart must not edit a resource it
  # does not own.
  enabled: false
  host: ""
  gatewaySelector:
    istio: ingressgateway
  tlsSecret: wildcard-agyn-dev-tls
  gatewayNamespace: istio-gateway

# One Job for the cluster wiring a chart cannot express as a template. It runs
# BEFORE the release, so the port, the DNS name and the CA are in place by the
# time anything that needs them starts -- run afterwards, the Gateway comes up
# unable to reach the issuer and crashloops until something restarts it. Each
# piece is independently skippable and each is idempotent.
wiring:
  enabled: false
  # Needs kubectl AND a shell: rancher/kubectl is distroless and bitnami no
  # longer publishes versioned free tags (the same trap the notifications redis
  # is pinned by digest for). Track the cluster's minor.
  image:
    repository: alpine/k8s
    tag: "1.33.1"
    pullPolicy: IfNotPresent
  # Copies the ingress CA into this namespace as a ConfigMap. The Gateway and
  # Media Proxy fetch discovery, JWKS and userinfo from the issuer themselves,
  # and a pod cannot read a Secret from another namespace.
  caBundle:
    enabled: false
    sourceNamespace: istio-gateway
    sourceSecret: agyn-dev-ca
    configMapName: agyn-local-ca
  # Points the auth hostname at the ingress from inside the cluster. Merged into
  # coredns-custom rather than written over it -- OpenZiti keeps its own
  # rewrites in the same ConfigMap.
  corednsRewrite:
    enabled: false
    target: istio-ingressgateway.istio-gateway.svc.cluster.local
  # Publishes the browser's port on the ingress Service, mapped to the same TLS
  # listener. The issuer is one URL used from the browser and from in-cluster,
  # so the port in it has to answer on both sides.
  ingressHostPort:
    enabled: false
    port: 2496
    service: istio-ingressgateway
    namespace: istio-gateway
    targetPort: 443

# Redirect targets for the four app clients. Empty entries drop the client, so
# an install that runs only some of the apps does not carry dead redirect URIs.
appOrigins:
  console: https://console.agyn.dev:2496
  chat: https://chat.agyn.dev:2496
  tracing: https://tracing.agyn.dev:2496
  sandboxes: https://sandboxes.agyn.dev:2496

# The user the bundle ships with. Its email is what users.FIRST_ADMIN_EMAIL
# matches on, and emailVerified must stay true or the claim is refused.
adminUser:
  username: admin
  email: admin@agyn.dev
  firstName: Local
  lastName: Admin

database:
  host: ""
  port: 5432
  name: keycloak
  username: agyn
  password: agyn
  # Takes precedence over password when set.
  existingSecret: ""
  passwordKey: password

# Passwords for the master-realm bootstrap admin and the agyn-realm admin user.
auth:
  existingSecret: ""
  bootstrapPassword: admin
  bootstrapPasswordKey: bootstrap-admin-password
  adminPassword: admin
  adminPasswordKey: admin-password

# Keycloak re-augments itself on start and writes under /opt/keycloak, so the
# root filesystem cannot be read-only.
securityContext:
  enabled: true
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

command: []
args:
  - start
  - --import-realm

containerPorts:
  - name: http
    containerPort: 8080
    protocol: TCP
  # Health and metrics moved off the HTTP port in Keycloak 25.
  - name: management
    containerPort: 9000
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

env:
  - name: KC_DB
    value: postgres
  - name: KC_DB_URL_HOST
    value: "{{ .Values.database.host }}"
  - name: KC_DB_URL_PORT
    value: "{{ .Values.database.port }}"
  - name: KC_DB_URL_DATABASE
    value: "{{ .Values.database.name }}"
  - name: KC_DB_USERNAME
    value: "{{ .Values.database.username }}"
  - name: KC_HOSTNAME
    value: "{{ .Values.externalUrl }}"
  # Istio terminates TLS, so Keycloak serves plain HTTP and trusts the
  # forwarded headers for the scheme and port it advertises.
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_PROXY_HEADERS
    value: xforwarded
  - name: KC_HEALTH_ENABLED
    value: "true"

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1Gi

# First start runs a schema migration and the realm import, so the startup
# probe is what has to be patient; liveness stays tight.
startupProbe:
  enabled: true
  httpGet:
    path: /health/started
    port: management
  periodSeconds: 5
  failureThreshold: 60
readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: management
  periodSeconds: 10
livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: management
  periodSeconds: 30

serviceAccount:
  create: true
  name: ""
  annotations: {}
automountServiceAccountToken: false

envFrom: []
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""

configMounts: []
# Keycloak writes its re-augmented build and transient state here; both stay
# off the image layer so a restart starts from the same place.
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp
extraVolumes:
  - name: tmp
    emptyDir: {}

initContainers: []
extraContainers: []

lifecycle: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts: []
  tls: []

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: ""
    scrapeTimeout: ""
    honorLabels: false
    labels: {}
    annotations: {}
    relabelings: []
    metricRelabelings: []
    endpoints:
      - port: management
        path: /metrics
        interval: ""
        scrapeTimeout: ""
