nameOverride: ""
fullnameOverride: "terminal-proxy"

global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  registry: ""
  repository: ghcr.io/agynio/terminal-proxy
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1
revisionHistoryLimit: 10
updateStrategy: {}

deploymentAnnotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

automountServiceAccountToken: true

rbac:
  create: false
  clusterWide: false
  rules: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  enabled: true
  fsGroup: 10001

securityContext:
  enabled: true
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

priorityClassName: ""
terminationGracePeriodSeconds: null

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  labels: {}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP

containerPorts:
  - name: http
    containerPort: 8080
    protocol: TCP
  - name: grpc
    containerPort: 50051
    protocol: TCP

command: []
args: []
env:
  - name: HTTP_ADDRESS
    value: ":8080"
  - name: GRPC_ADDRESS
    value: ":50051"
  - name: TERMINAL_PROXY_WEBSOCKET_URL
    value: "wss://terminal.example.com/terminal"
  - name: TERMINAL_PROXY_TICKET_SIGNING_KEY
    valueFrom:
      secretKeyRef:
        name: terminal-proxy-ticket-signing
        key: signing-key
  - name: RUNNERS_ADDRESS
    value: "runners:50051"
  - name: AGENTS_ADDRESS
    value: "agents:50051"
  - name: AUTHORIZATION_ADDRESS
    value: "authorization:50051"
  - name: ZITI_ENABLED
    value: "true"
  - name: ZITI_IDENTITY_FILE
    value: "/var/run/agyn/terminal-proxy-ziti/identity.json"
envFrom: []
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""

configMounts: []
extraVolumeMounts:
  - name: ziti-identity
    mountPath: /var/run/agyn/terminal-proxy-ziti
    readOnly: true
extraVolumes:
  - name: ziti-identity
    emptyDir: {}
  - name: ziti-enrollment
    secret:
      secretName: terminal-proxy-enrollment

initContainers:
  - name: enroll-ziti-identity
    image: openziti/ziti-cli:2.0.0-pre10
    imagePullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -ec
    args:
      - |
        ziti edge enroll \
          --jwt /etc/ziti-enrollment/enrollmentJwt \
          --out /var/run/agyn/terminal-proxy-ziti/identity.json
        chmod 0400 /var/run/agyn/terminal-proxy-ziti/identity.json
    volumeMounts:
      - name: ziti-enrollment
        mountPath: /etc/ziti-enrollment
        readOnly: true
      - name: ziti-identity
        mountPath: /var/run/agyn/terminal-proxy-ziti
extraContainers: []

lifecycle: {}

livenessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: false

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: null

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts: []
  tls: []

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: ""
    scrapeTimeout: ""
    honorLabels: false
    labels: {}
    annotations: {}
    relabelings: []
    metricRelabelings: []
    endpoints:
      - port: http
        path: /metrics
        interval: ""
        scrapeTimeout: ""
