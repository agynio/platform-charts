{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dex.secretName" . }}
  labels:
{{ include "service-base.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $user := .Values.users | default (list) }}
  {{ include "dex.hashSecretKey" $user }}: {{ required (printf "dex.users[%s].passwordHash is required, or set dex.auth.existingSecret" $user.username) $user.passwordHash | quote }}
  {{- end }}
  {{- if not .Values.database.existingSecret }}
  database-password: {{ .Values.database.password | quote }}
  {{- end }}
  {{- if and .Values.config.sessions.enabled .Values.config.sessions.cookieEncryptionKey }}
  session-cookie-key: {{ .Values.config.sessions.cookieEncryptionKey | quote }}
  {{- end }}
{{- end }}
