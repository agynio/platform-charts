{{- if .Values.files.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: files
  labels:
    app.kubernetes.io/name: files
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: files
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: grpc
      port: {{ .Values.files.service.port }}
      targetPort: grpc
      protocol: TCP
{{- end }}
