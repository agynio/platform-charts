{{- $dbSecretName := required "platform.database.existingSecret is required" .Values.platform.database.existingSecret -}}
{{- $dbKeyPattern := required "platform.database.existingSecretKeyPattern is required" .Values.platform.database.existingSecretKeyPattern -}}
{{- $egressDatabaseKey := tpl $dbKeyPattern (dict "service" "egress") -}}
{{- $_ := required "platform.serviceEndpoints.authorization is required" .Values.platform.serviceEndpoints.authorization -}}
{{- $egressTarget := required "platform.serviceEndpoints.egress is required" .Values.platform.serviceEndpoints.egress -}}
{{- $secretsTarget := required "platform.serviceEndpoints.secrets is required" .Values.platform.serviceEndpoints.secrets -}}
{{- $notificationsTarget := required "platform.serviceEndpoints.notifications is required" .Values.platform.serviceEndpoints.notifications -}}
{{- $meteringTarget := required "platform.serviceEndpoints.metering is required" .Values.platform.serviceEndpoints.metering -}}
{{- $tracingTarget := required "platform.serviceEndpoints.tracing is required" .Values.platform.serviceEndpoints.tracing -}}
{{- $agentsTarget := required "platform.serviceEndpoints.agents is required" .Values.platform.serviceEndpoints.agents -}}
{{- $zitiManagementTarget := required "platform.serviceEndpoints.zitiManagement is required" .Values.platform.serviceEndpoints.zitiManagement -}}
{{- $egressEnv := dict -}}
{{- range $env := .Values.egress.env | default list -}}
{{- $_ := set $egressEnv $env.name $env -}}
{{- end -}}
{{- $egressDatabaseEnv := required "egress.env must include DATABASE_URL" (get $egressEnv "DATABASE_URL") -}}
{{- $egressDatabaseRef := required "egress DATABASE_URL must use valueFrom.secretKeyRef" $egressDatabaseEnv.valueFrom.secretKeyRef -}}
{{- if ne $egressDatabaseRef.name $dbSecretName -}}
{{- fail (printf "egress DATABASE_URL secret name must equal platform.database.existingSecret (%s)" $dbSecretName) -}}
{{- end -}}
{{- if ne $egressDatabaseRef.key $egressDatabaseKey -}}
{{- fail (printf "egress DATABASE_URL secret key must equal platform.database.existingSecretKeyPattern for egress (%s)" $egressDatabaseKey) -}}
{{- end -}}
{{- $egressServiceEnv := dict "ZITI_MANAGEMENT_ADDRESS" $zitiManagementTarget "AUTHORIZATION_SERVICE_ADDRESS" .Values.platform.serviceEndpoints.authorization "SECRETS_SERVICE_ADDRESS" $secretsTarget "NOTIFICATIONS_ADDRESS" $notificationsTarget -}}
{{- range $name, $target := $egressServiceEnv -}}
{{- $env := required (printf "egress.env must include %s" $name) (get $egressEnv $name) -}}
{{- if ne $env.value $target -}}
{{- fail (printf "egress.env[%s] must equal platform endpoint %s" $name $target) -}}
{{- end -}}
{{- end -}}
{{- if and .Values.gateway .Values.gateway.enabled .Values.gateway.gateway -}}
{{- if ne .Values.gateway.gateway.egressRulesGrpcTarget $egressTarget -}}
{{- fail (printf "gateway.gateway.egressRulesGrpcTarget must equal platform.serviceEndpoints.egress (%s)" $egressTarget) -}}
{{- end -}}
{{- end -}}
{{- if and .Values.secrets .Values.secrets.enabled .Values.secrets.egressRules -}}
{{- if ne .Values.secrets.egressRules.grpcTarget $egressTarget -}}
{{- fail (printf "secrets.egressRules.grpcTarget must equal platform.serviceEndpoints.egress (%s)" $egressTarget) -}}
{{- end -}}
{{- end -}}
{{- $gatewayEnv := dict -}}
{{- range $env := index .Values "egress-gateway" "env" | default list -}}
{{- $_ := set $gatewayEnv $env.name $env -}}
{{- end -}}
{{- $gatewayServiceEnv := dict "EGRESS_ADDRESS" $egressTarget "SECRETS_SERVICE_ADDRESS" $secretsTarget "NOTIFICATIONS_ADDRESS" $notificationsTarget "METERING_ADDRESS" $meteringTarget "TRACING_ADDRESS" $tracingTarget "AGENTS_SERVICE_ADDRESS" $agentsTarget "ZITI_MANAGEMENT_ADDRESS" $zitiManagementTarget -}}
{{- range $name, $target := $gatewayServiceEnv -}}
{{- $env := required (printf "egress-gateway.env must include %s" $name) (get $gatewayEnv $name) -}}
{{- if ne $env.value $target -}}
{{- fail (printf "egress-gateway.env[%s] must equal platform endpoint %s" $name $target) -}}
{{- end -}}
{{- end -}}
{{- $caCertEnv := required "egress-gateway.env must include EGRESS_CA_CERT_PATH" (get $gatewayEnv "EGRESS_CA_CERT_PATH") -}}
{{- if ne $caCertEnv.value "/var/run/agyn/egress-ca/tls.crt" -}}
{{- fail "egress-gateway.env[EGRESS_CA_CERT_PATH] must equal /var/run/agyn/egress-ca/tls.crt" -}}
{{- end -}}
{{- $caKeyEnv := required "egress-gateway.env must include EGRESS_CA_KEY_PATH" (get $gatewayEnv "EGRESS_CA_KEY_PATH") -}}
{{- if ne $caKeyEnv.value "/var/run/agyn/egress-ca/tls.key" -}}
{{- fail "egress-gateway.env[EGRESS_CA_KEY_PATH] must equal /var/run/agyn/egress-ca/tls.key" -}}
{{- end -}}
