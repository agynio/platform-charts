{{- if .Values.files.enabled -}}
{{- $s3Endpoint := required "s3.endpoint is required" .Values.s3.endpoint -}}
{{- $s3Bucket := required "s3.bucket is required" .Values.s3.bucket -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: files
  labels:
    app.kubernetes.io/name: files
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
spec:
  replicas: {{ .Values.files.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: files
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: files
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "agyn-platform.fullname" . }}-files
      containers:
        - name: files
          image: {{ printf "%s:%s" .Values.files.image.repository .Values.files.image.tag | quote }}
          imagePullPolicy: {{ .Values.files.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.files.service.port }}
              protocol: TCP
          env:
            - name: GRPC_ADDRESS
              value: {{ .Values.files.grpcAddress | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.files.databaseUrl.existingSecret | quote }}
                  key: {{ .Values.files.databaseUrl.existingSecretKey | quote }}
            - name: S3_ENDPOINT
              value: {{ $s3Endpoint | quote }}
            - name: S3_BUCKET
              value: {{ $s3Bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_USE_SSL
              value: {{ .Values.s3.useSSL | toString | quote }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ .Values.s3.forcePathStyle | toString | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agyn-platform-generated-files-s3
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agyn-platform-generated-files-s3
                  key: secret-key
            - name: MAX_FILE_SIZE
              value: {{ .Values.files.maxFileSize | quote }}
            - name: URL_EXPIRY
              value: {{ .Values.files.urlExpiry | quote }}
{{- end }}
