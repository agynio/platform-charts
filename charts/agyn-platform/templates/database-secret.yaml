{{- $sourceSecret := lookup "v1" "Secret" .Release.Namespace .Values.platform.database.existingSecret -}}
{{- $secretData := dict -}}
{{- if $sourceSecret -}}
{{- $secretData = $sourceSecret.data | default dict -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: agyn-platform-generated-database-urls
  labels:
    app.kubernetes.io/name: {{ include "agyn-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
type: Opaque
data:
{{ range $service := list "agents" "agents-orchestrator" "apps" "chat" "expose" "files" "identity" "llm" "organizations" "runners" "secrets" "threads" "tracing" "users" "ziti-management" }}{{ $sourceKey := tpl $.Values.platform.database.existingSecretKeyPattern (dict "service" $service) }}  {{ $service }}: {{ get $secretData $sourceKey | default "" | quote }}
{{ end -}}
