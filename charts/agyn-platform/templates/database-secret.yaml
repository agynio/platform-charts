{{- $secretName := required "platform.database.existingSecret is required" .Values.platform.database.existingSecret -}}
{{- $keyPattern := required "platform.database.existingSecretKeyPattern is required" .Values.platform.database.existingSecretKeyPattern -}}
apiVersion: v1
kind: Secret
metadata:
  name: agyn-platform-generated-database-urls
  labels:
    app.kubernetes.io/name: {{ include "agyn-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
  annotations:
    agyn.io/source-secret: {{ $secretName | quote }}
type: Opaque
stringData:
{{ range $service := list "agents" "agents-orchestrator" "apps" "chat" "expose" "files" "identity" "llm" "organizations" "runners" "secrets" "threads" "tracing" "users" "ziti-management" }}{{ $sourceKey := tpl $keyPattern (dict "service" $service) }}  {{ $service }}: {{ printf "copy from %s/%s" $secretName $sourceKey | quote }}
{{ end -}}
