{{- $terminalProxyTarget := required "platform.serviceEndpoints.terminalProxy is required" .Values.platform.serviceEndpoints.terminalProxy -}}
{{- $terminalWebSocketURL := required "platform.externalUrls.terminalProxyWebSocket is required" .Values.platform.externalUrls.terminalProxyWebSocket -}}
{{- $terminalValues := index .Values "terminal-proxy" -}}
{{- if $terminalValues.enabled -}}
{{- $terminalProxy := $terminalValues.terminalProxy | default dict -}}
{{- $requiredTerminalValues := dict "websocketUrl" $terminalWebSocketURL "runnersAddress" .Values.platform.serviceEndpoints.runners "agentsAddress" .Values.platform.serviceEndpoints.agents "authorizationAddress" .Values.platform.serviceEndpoints.authorization -}}
{{- range $name, $value := $requiredTerminalValues -}}
{{- $actual := get $terminalProxy $name -}}
{{- if ne $actual $value -}}
{{- fail (printf "terminal-proxy.terminalProxy.%s must equal %s" $name $value) -}}
{{- end -}}
{{- end -}}
{{- $signingKey := required "terminal-proxy.terminalProxy.ticketSigningKey is required" $terminalProxy.ticketSigningKey -}}
{{- if ne $signingKey.secretName "terminal-proxy-ticket-signing" -}}
{{- fail "terminal-proxy ticket signing secret name must equal terminal-proxy-ticket-signing" -}}
{{- end -}}
{{- if ne $signingKey.secretKey "signing-key" -}}
{{- fail "terminal-proxy ticket signing secret key must equal signing-key" -}}
{{- end -}}
{{- $ports := dict -}}
{{- range $port := $terminalValues.service.ports | default list -}}
{{- $_ := set $ports $port.name $port -}}
{{- end -}}
{{- $httpPort := required "terminal-proxy.service.ports must include http" (get $ports "http") -}}
{{- if or (ne (int $httpPort.port) 8080) (ne $httpPort.targetPort "http") -}}
{{- fail "terminal-proxy service http port must expose 8080 -> http" -}}
{{- end -}}
{{- $grpcPort := required "terminal-proxy.service.ports must include grpc" (get $ports "grpc") -}}
{{- if or (ne (int $grpcPort.port) 50051) (ne $grpcPort.targetPort "grpc") -}}
{{- fail "terminal-proxy service grpc port must expose 50051 -> grpc" -}}
{{- end -}}
{{- /* Identity handling must follow openziti.md#service-identity-self-enrollment:
       an infrastructure service on the overlay requests an ephemeral identity
       from Ziti Management at startup and renews its lease, so the identity is
       per-pod and dies with it. A mounted identity breaks that — a Secret is
       shared by every replica, and this service is explicitly designed to run
       several (the ticket signing key is shared precisely so any replica can
       validate another's ticket). Assert the identity is *not* mounted. */ -}}
{{- $ziti := $terminalProxy.ziti | default dict -}}
{{- if not $ziti.enabled -}}
{{- fail "terminal-proxy.terminalProxy.ziti.enabled must be true: dialing a runner in another network is only possible over the overlay" -}}
{{- end -}}
{{- if ne $ziti.managementAddress .Values.platform.serviceEndpoints.zitiManagement -}}
{{- fail (printf "terminal-proxy.terminalProxy.ziti.managementAddress must equal platform.serviceEndpoints.zitiManagement (%s)" .Values.platform.serviceEndpoints.zitiManagement) -}}
{{- end -}}
{{- range $mount := $terminalValues.extraVolumeMounts | default list -}}
{{- if or (eq $mount.name "ziti-identity") (eq $mount.name "ziti-enrollment") -}}
{{- fail (printf "terminal-proxy must not mount %s: the identity is requested from Ziti Management per pod, not mounted" $mount.name) -}}
{{- end -}}
{{- end -}}
{{- range $volume := $terminalValues.extraVolumes | default list -}}
{{- if or (eq $volume.name "ziti-identity") (eq $volume.name "ziti-enrollment") -}}
{{- fail (printf "terminal-proxy must not define the %s volume: a mounted identity is shared across replicas and survives restarts" $volume.name) -}}
{{- end -}}
{{- end -}}
{{- range $container := $terminalValues.initContainers | default list -}}
{{- if eq $container.name "enroll-ziti-identity" -}}
{{- fail "terminal-proxy must not run the enroll-ziti-identity initContainer: enrollment happens in-process at startup" -}}
{{- end -}}
{{- end -}}
{{- $runnersValues := .Values.runners | default dict -}}
{{- $runnersPolicy := .Values.platform.runnersAuthorizationPolicy | default dict -}}
{{- if not $runnersPolicy.enabled -}}
{{- fail "platform.runnersAuthorizationPolicy.enabled must be true when terminal-proxy is enabled" -}}
{{- end -}}
{{- if and $runnersValues.authorizationPolicy $runnersValues.authorizationPolicy.enabled -}}
{{- fail "runners.authorizationPolicy.enabled must be false so agyn-platform can render Terminal Proxy-aware runners policy" -}}
{{- end -}}
{{- $terminalProxyPrincipal := printf "cluster.local/ns/%s/sa/terminal-proxy" .Release.Namespace -}}
{{- $internalPrincipalFound := false -}}
{{- range $serviceAccount := $runnersPolicy.internalServiceAccounts | default list -}}
{{- $namespace := $serviceAccount.namespace | default $.Release.Namespace -}}
{{- if eq (printf "cluster.local/ns/%s/sa/%s" $namespace $serviceAccount.name) $terminalProxyPrincipal -}}
{{- $internalPrincipalFound = true -}}
{{- end -}}
{{- end -}}
{{- if not $internalPrincipalFound -}}
{{- fail (printf "platform.runnersAuthorizationPolicy.internalServiceAccounts must include terminal-proxy service account principal %s" $terminalProxyPrincipal) -}}
{{- end -}}
{{- end -}}
{{- if and .Values.gateway .Values.gateway.enabled .Values.gateway.gateway -}}
{{- if ne .Values.gateway.gateway.terminalProxyGrpcTarget $terminalProxyTarget -}}
{{- fail (printf "gateway.gateway.terminalProxyGrpcTarget must equal platform.serviceEndpoints.terminalProxy (%s)" $terminalProxyTarget) -}}
{{- end -}}
{{- $gatewayEnv := dict -}}
{{- range $env := .Values.gateway.env | default list -}}
{{- $_ := set $gatewayEnv $env.name $env -}}
{{- end -}}
{{- $gatewayTerminalEnv := required "gateway.env must include TERMINAL_PROXY_GRPC_TARGET until the Gateway chart exposes gateway.terminalProxyGrpcTarget" (get $gatewayEnv "TERMINAL_PROXY_GRPC_TARGET") -}}
{{- if ne $gatewayTerminalEnv.value $terminalProxyTarget -}}
{{- fail (printf "gateway.env[TERMINAL_PROXY_GRPC_TARGET] must equal platform.serviceEndpoints.terminalProxy (%s)" $terminalProxyTarget) -}}
{{- end -}}
{{- end -}}
