{{- $dbSecretName := required "platform.database.existingSecret is required" .Values.platform.database.existingSecret -}}
{{- $dbKeyPattern := required "platform.database.existingSecretKeyPattern is required" .Values.platform.database.existingSecretKeyPattern -}}
{{- $dbServices := list "agents" "agents-orchestrator" "egress" "groups" "apps" "chat" "expose" "files" "identity" "llm" "organizations" "runners" "secrets" "threads" "tracing" "users" "ziti-management" -}}
{{- range $service := $dbServices -}}
{{- $_ := required (printf "platform.database.existingSecretKeyPattern produced an empty key for service %q" $service) (tpl $dbKeyPattern (dict "service" $service)) -}}
{{- end -}}
{{- $s3SecretName := required "s3.existingSecret is required" .Values.s3.existingSecret -}}
{{- $accessKeyName := required "s3.accessKeyKey is required" .Values.s3.accessKeyKey -}}
{{- $secretKeyName := required "s3.secretKeyKey is required" .Values.s3.secretKeyKey -}}
{{- $_ := required "s3.endpoint is required" .Values.s3.endpoint -}}
{{- $_ := required "s3.bucket is required" .Values.s3.bucket -}}
{{- $_ := required "s3.region is required" .Values.s3.region -}}
{{- $natsEndpoint := required "platform.serviceEndpoints.nats is required" .Values.platform.serviceEndpoints.nats -}}
{{- if ne .Values.platform.eventBus.url $natsEndpoint -}}
{{- fail (printf "platform.eventBus.url must equal platform.serviceEndpoints.nats (%s)" $natsEndpoint) -}}
{{- end -}}
{{- if ne .Values.platform.eventBus.urlEnvName "NATS_URL" -}}
{{- fail "platform.eventBus.urlEnvName must equal NATS_URL" -}}
{{- end -}}
{{- if .Values.groups.enabled -}}
{{- $groupsTarget := required "platform.serviceEndpoints.groups is required when groups.enabled is true" .Values.platform.serviceEndpoints.groups -}}
{{- $groupsFullnameOverride := required "groups.fullnameOverride is required when groups.enabled is true" .Values.groups.fullnameOverride -}}
{{- $groupsRenderedTarget := printf "%s:50051" $groupsFullnameOverride -}}
{{- if ne $groupsTarget $groupsRenderedTarget -}}
{{- fail (printf "platform.serviceEndpoints.groups must equal the rendered Groups service target (%s)" $groupsRenderedTarget) -}}
{{- end -}}
{{- if not .Values.nats.enabled -}}
{{- if eq .Values.platform.eventBus.url "nats://nats:4222" -}}
{{- fail (printf "groups.enabled requires nats.enabled=true when platform.eventBus.url uses the default in-cluster endpoint (%s); set nats.enabled=true or override platform.serviceEndpoints.nats, platform.eventBus.url, and groups.env[NATS_URL] to an external event bus" $natsEndpoint) -}}
{{- end -}}
{{- end -}}
{{- $groupsDatabaseKey := tpl $dbKeyPattern (dict "service" "groups") -}}
{{- $groupsEnv := dict -}}
{{- range $env := .Values.groups.env | default list -}}
{{- $_ := set $groupsEnv $env.name $env -}}
{{- end -}}
{{- $groupsDatabaseEnv := required "groups.env must include DATABASE_URL" (get $groupsEnv "DATABASE_URL") -}}
{{- $groupsDatabaseRef := required "groups DATABASE_URL must use valueFrom.secretKeyRef" $groupsDatabaseEnv.valueFrom.secretKeyRef -}}
{{- if ne $groupsDatabaseRef.name $dbSecretName -}}
{{- fail (printf "groups DATABASE_URL secret name must equal platform.database.existingSecret (%s)" $dbSecretName) -}}
{{- end -}}
{{- if ne $groupsDatabaseRef.key $groupsDatabaseKey -}}
{{- fail (printf "groups DATABASE_URL secret key must equal platform.database.existingSecretKeyPattern for groups (%s)" $groupsDatabaseKey) -}}
{{- end -}}
{{- $groupsServiceEnv := dict "AUTHORIZATION_GRPC_TARGET" .Values.platform.serviceEndpoints.authorization "IDENTITY_GRPC_TARGET" .Values.platform.serviceEndpoints.identity "NATS_URL" .Values.platform.eventBus.url -}}
{{- range $name, $target := $groupsServiceEnv -}}
{{- $env := required (printf "groups.env must include %s" $name) (get $groupsEnv $name) -}}
{{- if ne $env.value $target -}}
{{- fail (printf "groups.env[%s] must equal platform endpoint %s" $name $target) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if .Values.nats.enabled -}}
{{- if not .Values.nats.config.jetstream.enabled -}}
{{- fail "nats.config.jetstream.enabled must be true when nats.enabled is true" -}}
{{- end -}}
{{- if not .Values.nats.config.jetstream.fileStore.enabled -}}
{{- fail "nats.config.jetstream.fileStore.enabled must be true when nats.enabled is true" -}}
{{- end -}}
{{- if not .Values.nats.config.jetstream.fileStore.pvc.enabled -}}
{{- fail "nats.config.jetstream.fileStore.pvc.enabled must be true when nats.enabled is true" -}}
{{- end -}}
{{- $_ := required "nats.config.jetstream.fileStore.pvc.size is required when nats.enabled is true" .Values.nats.config.jetstream.fileStore.pvc.size -}}
{{- $_ := required "nats.config.jetstream.fileStore.maxSize is required when nats.enabled is true" .Values.nats.config.jetstream.fileStore.maxSize -}}
{{- if not .Values.nats.service.enabled -}}
{{- fail "nats.service.enabled must be true when nats.enabled is true" -}}
{{- end -}}
{{- if not .Values.nats.service.ports.nats.enabled -}}
{{- fail "nats.service.ports.nats.enabled must be true when nats.enabled is true" -}}
{{- end -}}
{{- end -}}

{{- if .Values.validation.requireExistingSecrets -}}
{{- $dbSecret := lookup "v1" "Secret" .Release.Namespace $dbSecretName -}}
{{- if not $dbSecret -}}
{{- fail (printf "platform.database.existingSecret %q was not found in namespace %q" $dbSecretName .Release.Namespace) -}}
{{- end -}}
{{- $dbData := $dbSecret.data | default dict -}}
{{- range $service := $dbServices -}}
{{- $sourceKey := tpl $dbKeyPattern (dict "service" $service) -}}
{{- if not (hasKey $dbData $sourceKey) -}}
{{- fail (printf "platform.database.existingSecret %q is missing required key %q for service %q" $dbSecretName $sourceKey $service) -}}
{{- end -}}
{{- end -}}
{{- $s3Secret := lookup "v1" "Secret" .Release.Namespace $s3SecretName -}}
{{- if not $s3Secret -}}
{{- fail (printf "s3.existingSecret %q was not found in namespace %q" $s3SecretName .Release.Namespace) -}}
{{- end -}}
{{- $s3Data := $s3Secret.data | default dict -}}
{{- if not (hasKey $s3Data $accessKeyName) -}}
{{- fail (printf "s3.existingSecret %q is missing required access key %q" $s3SecretName $accessKeyName) -}}
{{- end -}}
{{- if not (hasKey $s3Data $secretKeyName) -}}
{{- fail (printf "s3.existingSecret %q is missing required secret key %q" $s3SecretName $secretKeyName) -}}
{{- end -}}
{{- end -}}
