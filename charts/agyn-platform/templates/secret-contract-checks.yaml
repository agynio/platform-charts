{{- $dbSecretName := required "platform.database.existingSecret is required" .Values.platform.database.existingSecret -}}
{{- $dbKeyPattern := required "platform.database.existingSecretKeyPattern is required" .Values.platform.database.existingSecretKeyPattern -}}
{{- $dbServices := list "agents" "agents-orchestrator" "apps" "chat" "expose" "files" "identity" "llm" "organizations" "runners" "secrets" "threads" "tracing" "users" "ziti-management" -}}
{{- range $service := $dbServices -}}
{{- $_ := required (printf "platform.database.existingSecretKeyPattern produced an empty key for service %q" $service) (tpl $dbKeyPattern (dict "service" $service)) -}}
{{- end -}}
{{- $s3SecretName := required "s3.existingSecret is required" .Values.s3.existingSecret -}}
{{- $accessKeyName := required "s3.accessKeyKey is required" .Values.s3.accessKeyKey -}}
{{- $secretKeyName := required "s3.secretKeyKey is required" .Values.s3.secretKeyKey -}}
{{- $_ := required "s3.endpoint is required" .Values.s3.endpoint -}}
{{- $_ := required "s3.bucket is required" .Values.s3.bucket -}}
{{- $_ := required "s3.region is required" .Values.s3.region -}}

{{- define "agyn-platform.requireDbEnvRef" -}}
{{- $root := .root -}}
{{- $service := .service -}}
{{- $values := .values -}}
{{- if $values.enabled -}}
{{- $expectedSecret := $root.Values.platform.database.existingSecret -}}
{{- $expectedKey := tpl $root.Values.platform.database.existingSecretKeyPattern (dict "service" $service) -}}
{{- $databaseEnv := dict -}}
{{- range $env := ($values.env | default (list)) -}}
{{- if eq $env.name "DATABASE_URL" -}}
{{- $databaseEnv = $env -}}
{{- end -}}
{{- end -}}
{{- if not $databaseEnv -}}
{{- fail (printf "%s.env must include DATABASE_URL using valueFrom.secretKeyRef" $service) -}}
{{- end -}}
{{- $secretRef := dig "valueFrom" "secretKeyRef" dict $databaseEnv -}}
{{- if not $secretRef -}}
{{- fail (printf "%s.env DATABASE_URL must use valueFrom.secretKeyRef" $service) -}}
{{- end -}}
{{- if ne (get $secretRef "name") $expectedSecret -}}
{{- fail (printf "%s.env DATABASE_URL secretKeyRef.name must match platform.database.existingSecret %q" $service $expectedSecret) -}}
{{- end -}}
{{- if ne (get $secretRef "key") $expectedKey -}}
{{- fail (printf "%s.env DATABASE_URL secretKeyRef.key must match platform.database.existingSecretKeyPattern result %q" $service $expectedKey) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- define "agyn-platform.requireSecretDbRef" -}}
{{- $root := .root -}}
{{- $service := .service -}}
{{- $enabled := .enabled -}}
{{- $ref := .ref -}}
{{- if $enabled -}}
{{- $expectedSecret := $root.Values.platform.database.existingSecret -}}
{{- $expectedKey := tpl $root.Values.platform.database.existingSecretKeyPattern (dict "service" $service) -}}
{{- if ne (get $ref "name") $expectedSecret -}}
{{- fail (printf "%s database existingSecret.name must match platform.database.existingSecret %q" $service $expectedSecret) -}}
{{- end -}}
{{- if ne (get $ref "key") $expectedKey -}}
{{- fail (printf "%s database existingSecret.key must match platform.database.existingSecretKeyPattern result %q" $service $expectedKey) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- define "agyn-platform.requireDatabaseUrlRef" -}}
{{- $root := .root -}}
{{- $service := .service -}}
{{- $enabled := .enabled -}}
{{- $ref := .ref -}}
{{- if $enabled -}}
{{- $expectedSecret := $root.Values.platform.database.existingSecret -}}
{{- $expectedKey := tpl $root.Values.platform.database.existingSecretKeyPattern (dict "service" $service) -}}
{{- if ne (get $ref "existingSecret") $expectedSecret -}}
{{- fail (printf "%s databaseUrl.existingSecret must match platform.database.existingSecret %q" $service $expectedSecret) -}}
{{- end -}}
{{- if ne (get $ref "existingSecretKey") $expectedKey -}}
{{- fail (printf "%s databaseUrl.existingSecretKey must match platform.database.existingSecretKeyPattern result %q" $service $expectedKey) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- include "agyn-platform.requireDbEnvRef" (dict "root" . "service" "agents" "values" (index .Values "agents")) -}}
{{- include "agyn-platform.requireDbEnvRef" (dict "root" . "service" "agents-orchestrator" "values" (index .Values "agents-orchestrator")) -}}
{{- include "agyn-platform.requireDbEnvRef" (dict "root" . "service" "apps" "values" (index .Values "apps")) -}}
{{- include "agyn-platform.requireDbEnvRef" (dict "root" . "service" "chat" "values" (index .Values "chat")) -}}
{{- include "agyn-platform.requireDbEnvRef" (dict "root" . "service" "expose" "values" (index .Values "expose")) -}}
{{- include "agyn-platform.requireDbEnvRef" (dict "root" . "service" "identity" "values" (index .Values "identity")) -}}
{{- include "agyn-platform.requireDbEnvRef" (dict "root" . "service" "organizations" "values" (index .Values "organizations")) -}}
{{- include "agyn-platform.requireDbEnvRef" (dict "root" . "service" "runners" "values" (index .Values "runners")) -}}
{{- include "agyn-platform.requireDbEnvRef" (dict "root" . "service" "threads" "values" (index .Values "threads")) -}}
{{- include "agyn-platform.requireDbEnvRef" (dict "root" . "service" "tracing" "values" (index .Values "tracing")) -}}
{{- include "agyn-platform.requireDbEnvRef" (dict "root" . "service" "users" "values" (index .Values "users")) -}}
{{- include "agyn-platform.requireDbEnvRef" (dict "root" . "service" "ziti-management" "values" (index .Values "ziti-management")) -}}
{{- include "agyn-platform.requireSecretDbRef" (dict "root" . "service" "secrets" "enabled" .Values.secrets.enabled "ref" .Values.secrets.database.existingSecret) -}}
{{- include "agyn-platform.requireDatabaseUrlRef" (dict "root" . "service" "llm" "enabled" (index .Values "llm").enabled "ref" .Values.llm.llm.databaseUrl) -}}
{{- include "agyn-platform.requireDatabaseUrlRef" (dict "root" . "service" "files" "enabled" (index .Values "files").enabled "ref" .Values.files.files.databaseUrl) -}}

{{- if .Values.files.enabled -}}
{{- if ne .Values.files.files.s3.endpoint .Values.s3.endpoint -}}
{{- fail (printf "files.files.s3.endpoint must match s3.endpoint %q" .Values.s3.endpoint) -}}
{{- end -}}
{{- if ne .Values.files.files.s3.bucket .Values.s3.bucket -}}
{{- fail (printf "files.files.s3.bucket must match s3.bucket %q" .Values.s3.bucket) -}}
{{- end -}}
{{- if ne .Values.files.files.s3.region .Values.s3.region -}}
{{- fail (printf "files.files.s3.region must match s3.region %q" .Values.s3.region) -}}
{{- end -}}
{{- if ne (.Values.files.files.s3.useSSL | toString) (.Values.s3.useSSL | toString) -}}
{{- fail (printf "files.files.s3.useSSL must match s3.useSSL %v" .Values.s3.useSSL) -}}
{{- end -}}
{{- if ne .Values.files.files.s3.accessKey.existingSecret $s3SecretName -}}
{{- fail (printf "files.files.s3.accessKey.existingSecret must match s3.existingSecret %q" $s3SecretName) -}}
{{- end -}}
{{- if ne .Values.files.files.s3.accessKey.existingSecretKey $accessKeyName -}}
{{- fail (printf "files.files.s3.accessKey.existingSecretKey must match s3.accessKeyKey %q" $accessKeyName) -}}
{{- end -}}
{{- if ne .Values.files.files.s3.secretKey.existingSecret $s3SecretName -}}
{{- fail (printf "files.files.s3.secretKey.existingSecret must match s3.existingSecret %q" $s3SecretName) -}}
{{- end -}}
{{- if ne .Values.files.files.s3.secretKey.existingSecretKey $secretKeyName -}}
{{- fail (printf "files.files.s3.secretKey.existingSecretKey must match s3.secretKeyKey %q" $secretKeyName) -}}
{{- end -}}
{{- end -}}

{{- if .Values.validation.requireExistingSecrets -}}
{{- $dbSecret := lookup "v1" "Secret" .Release.Namespace $dbSecretName -}}
{{- if not $dbSecret -}}
{{- fail (printf "platform.database.existingSecret %q was not found in namespace %q" $dbSecretName .Release.Namespace) -}}
{{- end -}}
{{- $dbData := $dbSecret.data | default dict -}}
{{- range $service := $dbServices -}}
{{- $sourceKey := tpl $dbKeyPattern (dict "service" $service) -}}
{{- if not (hasKey $dbData $sourceKey) -}}
{{- fail (printf "platform.database.existingSecret %q is missing required key %q for service %q" $dbSecretName $sourceKey $service) -}}
{{- end -}}
{{- end -}}
{{- $s3Secret := lookup "v1" "Secret" .Release.Namespace $s3SecretName -}}
{{- if not $s3Secret -}}
{{- fail (printf "s3.existingSecret %q was not found in namespace %q" $s3SecretName .Release.Namespace) -}}
{{- end -}}
{{- $s3Data := $s3Secret.data | default dict -}}
{{- if not (hasKey $s3Data $accessKeyName) -}}
{{- fail (printf "s3.existingSecret %q is missing required access key %q" $s3SecretName $accessKeyName) -}}
{{- end -}}
{{- if not (hasKey $s3Data $secretKeyName) -}}
{{- fail (printf "s3.existingSecret %q is missing required secret key %q" $s3SecretName $secretKeyName) -}}
{{- end -}}
{{- end -}}
