apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agyn-platform.fullname" . }}-contract
  labels:
    app.kubernetes.io/name: {{ include "agyn-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
data:
  database-mode: {{ .Values.platform.database.mode | quote }}
  database-secret: {{ .Values.platform.database.existingSecret | quote }}
  s3-secret: {{ .Values.s3.existingSecret | quote }}
  openfga-api-url: {{ .Values.openfga.apiUrl | quote }}
  openfga-store-id: {{ .Values.openfga.storeId | quote }}
  openfga-model-id: {{ .Values.openfga.modelId | quote }}
  cluster-admin-token-override-path: "gateway.env"
  registration-note: >-
    App, runner, and service-token registration is outside this chart scope.
    Provide pre-created Kubernetes Secrets referenced by subchart values.
