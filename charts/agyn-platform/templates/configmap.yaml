{{- if .Values.contractConfigMaps.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agyn-platform.fullname" . }}-contract
  labels:
    app.kubernetes.io/name: {{ include "agyn-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
data:
  database-mode: {{ .Values.platform.database.mode | quote }}
  database-secret: {{ .Values.platform.database.existingSecret | quote }}
  s3-secret: {{ .Values.s3.existingSecret | quote }}
  s3-configmap: "agyn-platform-files-s3-config"
  require-existing-secrets: {{ .Values.validation.requireExistingSecrets | quote }}
  openfga-api-url: {{ .Values.platform.openfga.apiUrl | quote }}
  openfga-store-id: {{ .Values.platform.openfga.storeId | quote }}
  openfga-model-id: {{ .Values.platform.openfga.modelId | quote }}
  event-bus-url-env-name: {{ .Values.platform.eventBus.urlEnvName | quote }}
  nats-url: {{ .Values.platform.eventBus.url | quote }}
  nats-endpoint: {{ .Values.platform.serviceEndpoints.nats | quote }}
  nats-streams: {{ .Values.nats.platform.streams.enabled | quote }}
  cluster-admin-token-override-path: "gateway.env"
  terminal-proxy-target: {{ .Values.platform.serviceEndpoints.terminalProxy | quote }}
  terminal-proxy-websocket-url: {{ .Values.platform.externalUrls.terminalProxyWebSocket | quote }}
  terminal-proxy-ticket-signing-secret: "terminal-proxy-ticket-signing"
  terminal-proxy-enrollment-secret: "terminal-proxy-enrollment"
  egress-database-key: {{ tpl .Values.platform.database.existingSecretKeyPattern (dict "service" "egress") | quote }}
  groups-database-key: {{ tpl .Values.platform.database.existingSecretKeyPattern (dict "service" "groups") | quote }}
  egress-target: {{ .Values.platform.serviceEndpoints.egress | quote }}
  groups-target: {{ .Values.platform.serviceEndpoints.groups | quote }}
  egress-ca-secret: "egress-ca"
  egress-gateway-ziti-identity-secret: "egress-gateway-ziti-identity"
  registration-note: >-
    App, runner, and service-token registration is outside this chart scope.
    Provide pre-created Kubernetes Secrets referenced by subchart values.
{{- end }}
