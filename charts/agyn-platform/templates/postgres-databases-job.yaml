{{- if .Values.postgres.enabled -}}
{{- $pg := .Values.postgres -}}
{{- $auth := $pg.postgres -}}
{{- $host := printf "%s.%s.svc" $pg.fullnameOverride .Release.Namespace -}}
{{- $databases := $pg.databases -}}
# The init script creates databases only when the data directory is first
# initialised, so a service added to an existing install has none. This creates
# what is missing before anything that needs it starts.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agyn-platform.fullname" . }}-postgres-databases
  labels:
    app.kubernetes.io/name: {{ include "agyn-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agyn-platform.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: create-databases
          image: {{ $pg.image | default "postgres:16.6-alpine" | quote }}
          env:
            - name: PGHOST
              value: {{ $host | quote }}
            - name: PGUSER
              value: {{ $auth.username | quote }}
            - name: PGPASSWORD
              value: {{ $auth.password | quote }}
            - name: PGDATABASE
              value: {{ $auth.database | quote }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until pg_isready -q; do sleep 2; done
              {{- range $service, $database := $databases }}
              psql -v ON_ERROR_STOP=1 -tc "SELECT 1 FROM pg_database WHERE datname = '{{ $database }}'" \
                | grep -q 1 || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE {{ $database }}"
              {{- end }}
{{- end }}
