{{- $prov := .Values.platform.database.provisioning -}}
{{- if $prov.enabled -}}
{{- $pg := .Values.postgres -}}
{{- $databases := $prov.databases | default $pg.databases -}}
{{- if not $databases -}}
{{- fail "platform.database.provisioning.databases must list the databases to check, or set platform.database.provisioning.enabled=false" -}}
{{- end -}}
{{- $keyPattern := required "platform.database.existingSecretKeyPattern is required" .Values.platform.database.existingSecretKeyPattern -}}
{{- $anyService := first (keys $databases | sortAlpha) -}}
# A service whose database does not exist crash-loops, and the release reports
# only that it timed out waiting. This says which database is missing, and
# creates it when the platform's own credentials are allowed to.
#
# Upgrades only. A first install has nothing to reconcile -- the bundled
# postgres runs its init script, an operator's own is provisioned before the
# release -- and neither the server nor the secret this reads exists yet when a
# pre-install hook runs.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agyn-platform.fullname" . }}-postgres-databases
  labels:
    app.kubernetes.io/name: {{ include "agyn-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ $prov.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agyn-platform.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: create-databases
          image: "{{ $prov.image.repository }}:{{ $prov.image.tag }}"
          imagePullPolicy: {{ $prov.image.pullPolicy }}
          env:
            - name: SERVER_URL
              valueFrom:
                secretKeyRef:
                  {{- if $prov.adminSecret.name }}
                  name: {{ $prov.adminSecret.name | quote }}
                  key: {{ $prov.adminSecret.key | quote }}
                  {{- else }}
                  # Any service's URL names the same server. The database in it
                  # is replaced below, so this works before it exists.
                  name: {{ .Values.platform.database.existingSecret | quote }}
                  key: {{ tpl $keyPattern (dict "service" $anyService) | quote }}
                  {{- end }}
            - name: MAINTENANCE_DATABASE
              value: {{ $prov.maintenanceDatabase | quote }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              # Same server, a database that is always there: the ones being
              # checked may not be.
              admin_url="$(printf '%s' "$SERVER_URL" \
                | sed -E "s#(://[^/]+)/[^?]*#\1/${MAINTENANCE_DATABASE}#")"

              # Bounded: an unreachable server is a failure to report, not a
              # reason to hold the release open until it times out.
              waited=0
              until psql "$admin_url" -c 'SELECT 1' >/dev/null 2>&1; do
                waited=$((waited + 5))
                if [ "$waited" -ge {{ $prov.waitTimeoutSeconds }} ]; then
                  echo "database server unreachable after ${waited}s" >&2
                  exit 1
                fi
                sleep 5
              done

              missing=""
              for database in {{ range $service, $database := $databases }}{{ $database }} {{ end }}; do
                if psql "$admin_url" -v ON_ERROR_STOP=1 -tAc \
                    "SELECT 1 FROM pg_database WHERE datname = '${database}'" | grep -q 1; then
                  continue
                fi
                if psql "$admin_url" -v ON_ERROR_STOP=1 \
                    -c "CREATE DATABASE ${database}" >/dev/null 2>&1; then
                  echo "${database}: created"
                else
                  missing="${missing} ${database}"
                fi
              done

              if [ -n "$missing" ]; then
                echo "missing and could not be created:${missing}" >&2
                echo "grant the platform's database user CREATE privilege, set" >&2
                echo "platform.database.provisioning.adminSecret, or create them" >&2
                echo "yourself and set platform.database.provisioning.enabled=false" >&2
                exit 1
              fi
{{- end }}
