{{- $secretName := required "s3.existingSecret is required" .Values.s3.existingSecret -}}
{{- $accessKeyName := required "s3.accessKeyKey is required" .Values.s3.accessKeyKey -}}
{{- $secretKeyName := required "s3.secretKeyKey is required" .Values.s3.secretKeyKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: agyn-platform-generated-files-s3
  labels:
    app.kubernetes.io/name: {{ include "agyn-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
  annotations:
    agyn.io/source-secret: {{ $secretName | quote }}
type: Opaque
stringData:
  access-key: {{ printf "copy from %s/%s" $secretName $accessKeyName | quote }}
  secret-key: {{ printf "copy from %s/%s" $secretName $secretKeyName | quote }}
