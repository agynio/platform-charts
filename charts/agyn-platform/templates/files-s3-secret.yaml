{{- $sourceSecret := lookup "v1" "Secret" .Release.Namespace .Values.s3.existingSecret -}}
{{- $secretData := dict -}}
{{- if $sourceSecret -}}
{{- $secretData = $sourceSecret.data | default dict -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: agyn-platform-generated-files-s3
  labels:
    app.kubernetes.io/name: {{ include "agyn-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
type: Opaque
data:
  access-key: {{ get $secretData .Values.s3.accessKeyKey | default "" | quote }}
  secret-key: {{ get $secretData .Values.s3.secretKeyKey | default "" | quote }}
